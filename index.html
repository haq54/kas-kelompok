<title>Kaskita</title>

<style>
/* ===== Tema ===== */
:root {
  color-scheme: light;
  --bg-img: none;
  --r: 10px; --rf: 8px; --rb: 8px; --rn: 7px; --bw: 1px; --sh: none; --shb: none;
  --bg: #F2F4F1;  --surface: #fff;  --field: #F6F8F5;
  --ink: #16231F; --muted: #5E6B66; --line: #DCE2DD;
  --accent: #1F4E79; --accent-ink: #fff;
  --in: #18794E;  --in-soft: #E1F1E8;
  --muka: #0B76B0;
  --out: #B23A2B; --out-soft: #F8E6E2;
  --warn: #8A6100; --warn-soft: #FBF0D0;
  --font-main: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
  --fz: 1; /* pengali ukuran teks per gaya (pixel 0.85, hand-drawn 1.1) */
  --fd: var(--font-main); --fb: var(--font-main); --fm: var(--font-mono);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --bg: #0F1613;  --surface: #18221E;  --field: #121B17;
    --ink: #E7EEEA; --muted: #93A39B; --line: #2A3832;
    --accent: #7FB0E0; --accent-ink: #0F1613;
    --in: #5CC58D;  --in-soft: #173126;
    --out: #F0897A; --out-soft: #3A1D19;
    --warn: #E6C265; --warn-soft: #3A311A;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1613;  --surface: #18221E;  --field: #121B17;
  --ink: #E7EEEA; --muted: #93A39B; --line: #2A3832;
  --accent: #7FB0E0; --accent-ink: #0F1613;
  --in: #5CC58D;  --in-soft: #173126;
  --out: #F0897A; --out-soft: #3A1D19;
  --warn: #E6C265; --warn-soft: #3A311A;
}
:root[data-theme="hitam"] {
  color-scheme: dark;
  --bg: #000000; --surface: #111413; --field: #0A0C0B; --ink: #ECECEC; --muted: #9A9F9C;
  --line: #262A28; --accent: #7FB0E0; --accent-ink: #000000; --in: #5CC58D; --in-soft: #0F2A1D;
  --out: #F0897A; --out-soft: #2E1612; --warn: #E6C265; --warn-soft: #2A2410;
}
:root[data-theme="biru"] {
  color-scheme: dark;
  --bg: #1B2740; --bg-img: linear-gradient(180deg, #222F4C 0%, #1B2740 100%);
  --surface: #26344F; --field: #202C45; --ink: #E8EDF5; --muted: #A3B0C6;
  --line: #36466A; --accent: #9DB8E0; --accent-ink: #1B2740; --in: #7FCFA6; --in-soft: #1F3D3F;
  --out: #F0A596; --out-soft: #4A2F3E; --warn: #F0D58E; --warn-soft: #4A4030;
}
:root[data-theme="mawar"] {
  color-scheme: light;
  --bg: #F3E4E1; --bg-img: linear-gradient(180deg, #F6E7E3 0%, #EBD5D2 100%);
  --surface: #FBF3F1; --field: #F5E8E5; --ink: #2E1D1D; --muted: #6B5453;
  --line: #E2CBC8; --accent: #8C2F39; --accent-ink: #FFFFFF; --in: #176B42; --in-soft: #DDEEDF;
  --out: #A8322A; --out-soft: #F6DAD5; --warn: #7A5200; --warn-soft: #F7E8C3;
}
:root[data-theme="eukaliptus"] {
  color-scheme: light;
  --bg: #EBF0EC; --surface: #F9FBF9; --field: #F0F4F1; --ink: #1B2620; --muted: #5D6E64;
  --line: #D7E2D9; --accent: #2C3E35; --accent-ink: #FFFFFF; --in: #1F6B4A; --in-soft: #DDEEE3;
  --out: #A8402A; --out-soft: #FBECE8; --warn: #7A5200; --warn-soft: #F7EBC9;
}
:root[data-theme="nordik"] {
  color-scheme: light;
  --bg: #EDF1F4; --surface: #FFFFFF; --field: #F3F6F8; --ink: #16212C; --muted: #5E6E7E;
  --line: #DCE3E8; --accent: #1E4E5F; --accent-ink: #FFFFFF; --in: #1A6B50; --in-soft: #E0F1EA;
  --out: #A8402A; --out-soft: #FCEAE6; --warn: #7A5200; --warn-soft: #F7EBC9;
}
/* ===== Dasar ===== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--bg); background-image: var(--bg-img); background-attachment: fixed;
  color: var(--ink);
  font: calc(.9375rem * var(--fz, 1))/1.5 var(--fb);
  padding: calc(20px + env(safe-area-inset-top, 0px))
           max(14px, env(safe-area-inset-right, 0px))
           calc(40px + env(safe-area-inset-bottom, 0px))
           max(14px, env(safe-area-inset-left, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
h1 { font: 700 calc(1.6rem * var(--fz, 1))/1.2 var(--fd); margin: 0; }
h2 { font: 600 calc(1.05rem * var(--fz, 1))/1.3 var(--fd); margin: 0; }

.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.dvc { padding: 0; gap: 0; overflow: hidden; margin-top: 8px; }
.dvr { display: flex; align-items: stretch; }
.dvmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 14px; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.dvmain svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.dvmain b { display: block; font-weight: 600; }
.dvmain small { display: block; color: var(--muted); font-size: calc(.85rem * var(--fz, 1)); }
.dvdot { width: 52px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.dvdot[aria-expanded="true"] { color: var(--accent); }
.dvp { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.badge.dev { border-color: var(--accent); color: var(--accent); }
.badge {
  font-size: calc(.78rem * var(--fz, 1)); font-weight: 600; color: var(--muted);
  background: none; border: 1px solid var(--line); border-radius: 99px;
  padding: 2px 10px; cursor: pointer;
}

/* ===== Navigasi ===== */
nav {
  display: grid; gap: 4px; padding: 4px;
  background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); box-shadow: var(--sh);
}
nav button {
  height: 36px; border: 0; border-radius: var(--rn); background: none;
  color: var(--muted); font-weight: 600; font-size: calc(.88rem * var(--fz, 1)); cursor: pointer;
}
nav button[aria-pressed=true] { background: var(--ink); color: var(--bg); }

/* ===== Komponen ===== */
.card {
  background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); box-shadow: var(--sh);
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.lab { font-family: var(--font-mono); font-size: calc(.72rem * var(--fz, 1)); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font: 700 calc(clamp(2rem, 8vw, 2.8rem) * var(--fz, 1))/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
/* Semua angka sejajar vertikal (nominal, saldo, tabel anggota, statistik) */
body, input, select, textarea, button { font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid > div { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
.sm { font-size: calc(.85rem * var(--fz, 1)); color: var(--muted); margin: 0; }
.in { color: var(--in); }
.out { color: var(--out); }
.err { color: var(--out); font-size: calc(.88rem * var(--fz, 1)); margin: 0; }
.ok  { color: var(--in);  font-size: calc(.88rem * var(--fz, 1)); margin: 0; }

.alert { background: var(--warn-soft); color: var(--warn); border-radius: var(--rf); padding: 10px 12px; font-size: calc(.9rem * var(--fz, 1)); font-weight: 500; }
.alert.red { background: var(--out-soft); color: var(--out); }
.alert.green { background: var(--in-soft); color: var(--in); }

input, select, textarea {
  width: 100%; min-height: 42px; padding: 8px 12px;
  background: var(--field); border: 1px solid var(--line); border-radius: var(--rf);
}
textarea { min-height: 110px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
/* pemilih bertema */
.selw { position: relative; }
.selw select { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.selbtn {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 42px; padding: 8px 12px;
  background: var(--field); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-align: left; cursor: pointer;
}
.selbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selbtn svg { flex: none; color: var(--muted); }
.selbtn.kosong span { color: var(--muted); }
#sht { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .45); }
#sht[hidden] { display: none; }
.shp {
  width: 100%; max-width: 560px; max-height: 78vh; display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .25); animation: naik .18s ease-out;
}
@keyframes naik { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .shp { animation: none; } }
.shh { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.shq { width: auto; margin: 0 16px 8px; }
.shq[hidden] { display: none; }
.shl { overflow-y: auto; padding: 0 8px 16px; }
.sho {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 10px 12px;
  border: 0; border-radius: 8px; background: transparent; color: var(--ink); text-align: left; cursor: pointer;
}
.sho:hover, .sho:active { background: var(--field); }
.sho[aria-selected="true"] { background: var(--field); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.sho small { display: block; color: var(--muted); font-weight: 400; font-size: calc(.82rem * var(--fz, 1)); }
.sho .st { flex: none; font-size: calc(.78rem * var(--fz, 1)); font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--out-soft); color: var(--out); white-space: nowrap; }
.sho .st.ok { background: var(--in-soft); color: var(--in); }

.row > * { flex: 1 1 9rem; }

.btn {
  min-height: 42px; padding: 0 16px; border: 0; border-radius: var(--rb); box-shadow: var(--shb);
  background: var(--accent); color: var(--accent-ink);
  font-weight: 600; cursor: pointer; flex: 0 0 auto; width: auto;
}
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
.btn.sm2 { min-height: 34px; padding: 0 12px; font-size: calc(.85rem * var(--fz, 1)); }
.btn.del { color: var(--out); }
.btn:disabled { opacity: .6; cursor: default; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.seg[hidden] { display: none; }
.seg button { height: 34px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-weight: 600; font-size: calc(.85rem * var(--fz, 1)); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.pen { display: flex; justify-content: flex-end; }
.pen .btn { width: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.pen svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pen .btn[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ibk { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer; color: var(--ink); font: inherit; }
.ibt { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* ===== Daftar anggota ===== */
.m { border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.m:first-child { border-top: 0; }
.m b { display: block; }
.m small { color: var(--muted); font-family: var(--fm); }
.chip { font-size: calc(.78rem * var(--fz, 1)); font-weight: 600; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.lunas  { background: var(--in-soft);   color: var(--in); }
.kurang { background: var(--warn-soft); color: var(--warn); }
:root[data-theme="dark"], :root[data-theme="hitam"], :root[data-theme="biru"] { --muka: #38bdf8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) { --muka: #38bdf8; } }
.dm { display: block; font-size: 11px; color: var(--muka); font-weight: 500; white-space: nowrap; }
.belum  { background: var(--out-soft);  color: var(--out); }
.off    { background: var(--field);     color: var(--muted); }
.det { background: var(--field); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

/* ===== Tabel & baris riwayat ===== */
table { width: 100%; border-collapse: collapse; font-size: calc(.88rem * var(--fz, 1)); }
th, td { padding: 6px 4px; text-align: right; border-top: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-size: calc(.72rem * var(--fz, 1)); color: var(--muted); text-transform: uppercase; border-top: 0; }
.pv { font-size: calc(.85rem * var(--fz, 1)); border-top: 1px solid var(--line); padding: 4px 0; display: flex; gap: 8px; align-items: center; }
.pv > :nth-last-child(1):not(:first-child) { margin-left: auto; }
.pv.hs { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; padding: 6px 0; }
.pv.hs.ha { grid-template-columns: 78px 1fr; }
.pv.hs > :nth-last-child(1) { margin-left: 0; text-align: left; min-width: 0; overflow-wrap: anywhere; }
.pv.hs .wk { line-height: 1.25; white-space: nowrap; }
.pv.hs .wk b { display: block; font-weight: 600; color: inherit; }
.hv { flex-wrap: wrap; }
.acts { display: flex; gap: 6px; }
.ed { border-top: 1px solid var(--line); padding: 8px 0; display: flex; flex-direction: column; gap: 8px; }

/* ===== Pengaturan, progres, tema ===== */
.hb { display: flex; gap: 6px; align-items: center; }
.shead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.shead .lnk { align-self: auto; }
.smenu { display: flex; flex-direction: column; background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; }
.smenu button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.smenu button:last-child { border-bottom: 0; }
.smenu svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.smenu b { display: block; font-weight: 600; }
.smenu small { display: block; color: var(--muted); font-size: calc(.85rem * var(--fz, 1)); margin-top: 2px; overflow-wrap: anywhere; }
.track { height: 8px; border-radius: 4px; background: var(--field); border: 1px solid var(--line); overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--in); border-radius: 4px; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.themes button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: calc(.85rem * var(--fz, 1)); font-weight: 600; cursor: pointer; }
.themes button[aria-pressed="true"], .sizes button[aria-pressed="true"] { border-color: var(--accent); }
.themes .sw { display: block; width: 100%; height: 34px; border-radius: 8px; border: 1px solid rgba(128, 128, 128, .45); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chips button { min-height: 36px; padding: 0 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: calc(.85rem * var(--fz, 1)); font-weight: 600; cursor: pointer; }
.chips button[aria-pressed="true"] { border-color: var(--accent); }
.sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sizes button { min-height: 40px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; }
.kv { display: flex; justify-content: space-between; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; font-size: calc(.9rem * var(--fz, 1)); }

/* ===== Layar login ===== */
#lgn { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lgc { width: 100%; max-width: 400px; gap: 12px; padding: 22px; }
.lgc .btn { width: 100%; }
.lnk { background: none; border: 0; color: var(--accent); text-decoration: underline; font-size: calc(.88rem * var(--fz, 1)); cursor: pointer; align-self: center; padding: 6px; }
/* ===== Gaya UI (atribut data-ui pada <html>) =====
   Gaya berpalet bebas (flat-minimalis, material-you, neumorphism) mengikuti "Tema warna".
   Gaya lain mengunci seluruh palet sendiri supaya kontras angka kas tetap terbaca. */

<body>

<script>
(function () {
  'use strict';

  /* =========================================================
   * Konfigurasi Firebase
   * ========================================================= */
  var FIREBASE_CONFIG = {
    apiKey: 'AIzaSyDzBP0ULv5qs-TB5ygQcT8YJDYyD39kjiE',
    authDomain: 'kas-kelas-b3e65.firebaseapp.com',
    projectId: 'kas-kelas-b3e65',
    storageBucket: 'kas-kelas-b3e65.firebasestorage.app',
    messagingSenderId: '423093944122',
    appId: '1:423093944122:web:b87e9413efbfe5dc8fda03'
  };
  var TOTAL_SUMBER = 6; // members, pay, exp, log, cfg/main, cfg/fitur

  /* =========================================================
   * State
   * ========================================================= */
  var db = null, auth = null;
  var canEdit = false;
  var M = [];                        // anggota (mentah)
  var P = [];                        // pembayaran kas anggota
  var X = [];                        // pengeluaran (termasuk pengembalian)
  var DEV_UID = 'bjA3cKodmmfTmgh7tjWPdQoLmKb2';   // pemilik aplikasi; izin sebenarnya ada di firestore.rules
  var isDev = false, devEdit = false, devKuasa = false;
  var KODE = '', RNAMA = '', pesanRoom = '', ROLES = {}, isHost = false, fdb = null, unsubRoles = null;
  var ALFABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // tanpa I, O (mirip 1, 0)
  var LOG = [];                      // riwayat perubahan
  var CFG = { base: 10000, naik: [] };
  var BAYAR = null, bayarLangkah = 0;   // cara bayar (cfg/bayar) dan langkah pengingat sebelum nomor tampil
  var D = [];                        // anggota + hasil hitungan (derive)
  var FITUR = null, IUR = [], IP = [], IX = [];   // sakelar fitur (cfg/fitur), daftar iuran bersama, dan pembayarannya
  var IBMUAT = { iur: false, ipay: false, iexp: false };
  var iSel = '', edBuka = '', qPre = '';   // iuran yang dibuka, anggota yang form ubahnya terbuka, iuran terpilih di tab Catat
  var tab = 'home', sel = null, q = '';
  // urutan anggota diingat di perangkat ini: Anggota, Catat iuran, dan pengingat memakai urutan yang sama
  var sortBy = (function () { try { var v = localStorage.getItem('kk-urut'); return ['nama', 'nim', 'kurang'].indexOf(v) > -1 ? v : 'nama'; } catch (e) { return 'nama'; } })();
  var loaded = 0, loadTimer = null;
  var armed = '', armTimer = null;   // konfirmasi hapus dua ketukan
  var ed = null;                     // catatan yang sedang diubah: {a, id, tgl, jml, ket}
  var dup = '';                      // kunci catatan kembar yang sudah diperingatkan
  var PV = [];                       // pratinjau impor
  var prevTab = 'home', sub = '';    // layar Pengaturan: tab sebelumnya dan sub-halamannya
  var histN = 12;                    // jumlah catatan di tab Catat
  var memEd = null;                  // ketikan di form ubah anggota (agar tidak hilang saat data diperbarui)
  var pengingat = '';                // teks pesan pengingat yang sedang tampil
  var lf = '';                       // filter riwayat di tab Laporan
  var filt = '';                     // filter status di tab Anggota
  var tertunda = 0;                  // jumlah penyimpanan yang belum dikonfirmasi server
  var dariCache = {}, staleTimer = null;

  /* =========================================================
   * Util
   * ========================================================= */
  var $ = function (s) { return document.querySelector(s); };

  var rp = function (n) {
    return (n < 0 ? '-' : '') + 'Rp' + Math.abs(Math.round(n)).toLocaleString('id-ID');
  };

  var esc = function (s) {
    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return map[c]; });
  };

  var pad2 = function (n) { return String(n).padStart(2, '0'); };

  var today = function () {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  };

  var MINGGU = function () { return CFG.periode === 'minggu'; };
  var SATUAN = function () { return MINGGU() ? 'minggu' : 'bulan'; };
  var tglUTC = function (s) { var p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); };
  var strUTC = function (d) { return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); };
  var tambahHari = function (s, n) { var d = tglUTC(s); d.setUTCDate(d.getUTCDate() + n); return strUTC(d); };
  var senin = function (s) { var d = tglUTC(s); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return strUTC(d); };
  /** Tanggal/bulan apa pun -> kunci periode ruang ini (bulan: YYYY-MM, minggu: tanggal Senin). */
  var kunci = function (s) { s = String(s || ''); return MINGGU() ? (s.length >= 10 ? senin(s.slice(0, 10)) : s) : s.slice(0, 7); };
  var cur = function () { return kunci(today()); };

  var BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  var bln = function (s) {
    var a = String(s).split('-');
    if (a.length > 2) {   // minggu: rentang Senin-Minggu
      var e = tambahHari(s, 6).split('-'), d1 = parseInt(a[2], 10), d2 = parseInt(e[2], 10);
      if (a[0] !== e[0]) return d1 + ' ' + BULAN[a[1] - 1] + ' ' + a[0] + '\u2013' + d2 + ' ' + BULAN[e[1] - 1] + ' ' + e[0];
      if (a[1] !== e[1]) return d1 + ' ' + BULAN[a[1] - 1] + '\u2013' + d2 + ' ' + BULAN[e[1] - 1] + ' ' + a[0];
      return d1 + '\u2013' + d2 + ' ' + BULAN[a[1] - 1] + ' ' + a[0];
    }
    return BULAN[a[1] - 1] + ' ' + a[0];
  };
  /** Akhir periode untuk label "Lunas (s.d. ...)": minggu -> "6 Des", bulan -> "Des 2026". */
  var akhirLabel = function (b) {
    if (String(b).length <= 7) return bln(b);
    var e = tambahHari(b, 6).split('-');
    return parseInt(e[2], 10) + ' ' + BULAN[e[1] - 1] + (e[0] !== today().slice(0, 4) ? ' ' + e[0] : '');
  };
  var tglByr = function (s) {
    var a = String(s || '').split('-');
    return a.length < 3 ? '-' : parseInt(a[2], 10) + ' ' + BULAN[a[1] - 1] + ' ' + a[0];
  };
  /** Kunci periode sesudah b (minggu: +7 hari, bulan: bulan berikutnya tanpa lompatan akhir bulan). */
  var nextKey = function (b) {
    if (MINGGU()) return tambahHari(b, 7);
    var p = b.split('-').map(Number), y = p[0], m = p[1] + 1;
    if (m > 12) { m = 1; y++; }
    return y + '-' + pad2(m);
  };

  var sum = function (arr, fn) {
    return arr.reduce(function (t, x) { return t + (fn(x) || 0); }, 0);
  };
  var jml = function (x) { return x.jumlah; };

  var num = function (s) { return parseInt(String(s).replace(/\D/g, '') || '0', 10); };

  var byNama = function (a, b) { return a.nama.localeCompare(b.nama, 'id'); };
  var urut = function (a, b) {
    if (sortBy === 'kurang') return ((b.kurang || 0) - (a.kurang || 0)) || byNama(a, b);
    if (sortBy === 'nim') return String(a.nim || '').localeCompare(String(b.nim || ''), 'id', { numeric: true }) || byNama(a, b);
    return byNama(a, b);
  };
  /* Terbaru dulu; tanggal sama diurutkan menurut waktu input supaya urutan tidak melompat. */
  var terbaru = function (a, b) { return String(b.tgl || '').localeCompare(String(a.tgl || '')) || ((b.ts || 0) - (a.ts || 0)); };
  var kap = function (t) { t = String(t || ''); return t.charAt(0).toUpperCase() + t.slice(1); };
  var isAktif = function (m) { return m.aktif !== false; };

  /** Daftar bulan 'YYYY-MM' dari a sampai b (inklusif). */
  function rentangBulan(a, b) {
    if (a.length > 7) { var w = [], d = a; while (d <= b) { w.push(d); d = tambahHari(d, 7); } return w; }
    var r = [], p = a.split('-').map(Number), e = b.split('-').map(Number);
    var y = p[0], m = p[1];
    while (y < e[0] || (y === e[0] && m <= e[1])) {
      r.push(y + '-' + pad2(m));
      if (++m > 12) { m = 1; y++; }
    }
    return r;
  }

  /** Format input rupiah: 1500000 -> 1.500.000 */
  function maskRupiah(el) {
    el.addEventListener('input', function () {
      var d = el.value.replace(/\D/g, '').slice(0, 12);
      el.value = d ? Number(d).toLocaleString('id-ID') : '';
    });
  }

  function note(msg, cls) {
    $('#note').innerHTML = msg ? '<div class="alert ' + (cls || '') + '">' + msg + '</div>' : '';
  }

  /** Tombol dua ketukan: true bila ketukan kedua terjadi dalam 3,5 detik. */
  function arm(k) {
    clearTimeout(armTimer);
    if (armed === k) { armed = ''; return true; }
    armed = k;
    armTimer = setTimeout(function () { armed = ''; segarkan(); }, 3500);
    segarkan();
    return false;
  }

  /** Gambar ulang layar; untuk halaman berisi isian, ketikan dipertahankan. */
  function segarkan() {
    if (tab === 'set' && (sub === 'room' || sub === 'pengurus')) {
      var ids = ['pu', 'pn', 'rk', 'rn'], v = {};
      ids.forEach(function (i) { if ($('#' + i)) v[i] = $('#' + i).value; });
      fSet();
      ids.forEach(function (i) { if ($('#' + i) && v[i] != null) $('#' + i).value = v[i]; });
    } else fill();
  }

  /** Tunggu hasil tulis ke Firestore: true bila berhasil, false (dengan pemberitahuan) bila ditolak. */
  function tulis(promise) {
    tertunda++;
    var tmr = setTimeout(function () { if (tertunda > 0) note('Menyimpan… menunggu koneksi. Jangan tutup aplikasi dulu.'); }, 2500);
    return promise.then(function () { return true; }, function () {
      note('Gagal menyimpan. Cek koneksi atau izin akun.', 'red');
      return false;
    }).then(function (ok) {
      clearTimeout(tmr);
      tertunda--;
      if (ok && !tertunda && /^Menyimpan/.test($('#note').textContent)) note('');
      return ok;
    });
  }

  /** Kelompok riwayat: batal (hapus), anggota, pengurus, atau keuangan. */
  function kategori(aksi) {
    var a = String(aksi || '').toLowerCase();
    if (/^(hapus|batalkan)/.test(a)) return 'batal';
    if (/pengurus|host|room|fitur/.test(a)) return 'pengurus';
    if (/anggota|impor/.test(a)) return 'anggota';
    return 'keuangan';
  }

  /** Satu perubahan = data + catatan riwayatnya, disimpan bersama atau tidak sama sekali. */
  function simpan(isi, aksi, ket) {
    var b = db.batch();
    isi(b);
    b.set(db.collection('log').doc(), { ts: Date.now(), aksi: aksi, ket: (isDev ? '[Dev] ' : '') + ket, kat: kategori(aksi) });
    if (isDev) audit(KODE, RNAMA, aksi, ket, b);
    return tulis(b.commit());
  }

  function nimDipakai(nim, kecuali) {
    return !!nim && M.some(function (m) { return m.nim === nim && m.id !== kecuali; });
  }

  /* =========================================================
   * Room (banyak kelompok dalam satu aplikasi)
   * ========================================================= */
  function normKode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function kodeSah(s) { return /^[A-Z0-9]{6,8}$/.test(s); }
  function daftarRoom() {
    try {
      var a = JSON.parse(lsGet('kk-rooms') || '[]');
      return Array.isArray(a) ? a.filter(function (r) { return r && kodeSah(r.kode); }) : [];
    } catch (e) { return []; }
  }
  function simpanRoom(kode, nama) {
    var a = daftarRoom().filter(function (r) { return r.kode !== kode; });
    a.unshift({ kode: kode, nama: nama || kode });
    lsSet('kk-rooms', JSON.stringify(a.slice(0, 12)));
  }
  function lupakanRoom(kode) {
    lsSet('kk-rooms', JSON.stringify(daftarRoom().filter(function (r) { return r.kode !== kode; })));
  }
  function muatUlang() { if (location.search) location.replace(location.pathname); else location.reload(); }
  function pilihRoom(kode, nama) { simpanRoom(kode, nama); lsSet('kk-room-aktif', kode); muatUlang(); }

  /** Pintasan ke data satu room: groups/{kode}/... */
  function ruang(kode) {
    var root = fdb.collection('groups').doc(kode);
    return {
      collection: function (c) { return root.collection(c); },
      doc: function (p) { var a = p.split('/'); return root.collection(a[0]).doc(a[1]); },
      batch: function () { return fdb.batch(); }
    };
  }

  // Kode room baru: 8 karakter, minimal 2 huruf dan 2 angka, tanpa pola yang mudah ditebak
  // (aturan yang sama dikunci di Firestore Rules, kecuali pola berulang yang hanya dicek di sini)
  function kodeLemah(k) {
    var n = k.length, i, j;
    if ((k.match(/[0-9]/g) || []).length < 2 || (k.match(/[A-Z]/g) || []).length < 2) return true;
    if (/(.)\1{3}/.test(k)) return true;                       // 4 karakter sama berurutan
    function urut(t) {                                          // naik atau turun, mis. ABCD / 4321
      var a = true, d = true;
      for (i = 1; i < t.length; i++) {
        var c = t.charCodeAt(i) - t.charCodeAt(i - 1);
        if (c !== 1) a = false;
        if (c !== -1) d = false;
      }
      return a || d;
    }
    if (urut(k.slice(0, 4)) || urut(k.slice(n - 4))) return true;   // urutan di depan atau belakang
    for (j = 1; j <= 4; j++) {                                  // pola ulang: ABABABAB, ABCDABCD
      if (n % j) continue;
      var u = k.slice(0, j), ok = true;
      for (i = j; i < n; i += j) if (k.substr(i, j) !== u) { ok = false; break; }
      if (ok) return true;
    }
    return false;
  }
  function buatKode() {
    var k, t = 0;
    do {
      var a = new Uint8Array(8);
      crypto.getRandomValues(a);
      k = Array.prototype.map.call(a, function (v) { return ALFABET.charAt(v % 32); }).join('');
    } while (kodeLemah(k) && ++t < 200);
    return k;
  }
  function kodeBebas(sisa) {
    var k = buatKode();
    return fdb.collection('groups').doc(k).get().then(function (s) {
      if (!s.exists) return k;
      if (sisa <= 1) throw new Error('kode');
      return kodeBebas(sisa - 1);
    });
  }

  function salin(teks, tombol) {
    var ok = false;
    try { navigator.clipboard.writeText(teks); ok = true; } catch (e) {}
    if (!ok) {
      var ta = document.createElement('textarea');
      ta.value = teks; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
    if (tombol) tombol.textContent = 'Tersalin';
  }

  function namaPeran() { return isDev ? (devKuasa ? 'Dev' : 'Dev · lihat') : isHost ? 'Host' : canEdit ? 'Bendahara' : 'Hanya lihat'; }

  function terapkanPeran() {
    var u = auth && auth.currentUser;
    var p = u ? ROLES[u.uid] : '';
    isDev = !!u && u.uid === DEV_UID;
    var asli = p === 'host' || p === 'bendahara';
    devKuasa = isDev && (asli || devEdit);       // di room orang lain, Dev hanya melihat sampai mengaktifkan edit
    canEdit = asli || devKuasa;
    isHost = p === 'host' || devKuasa;
    if (isDev && KODE) {
      var ka = 'kk-aud-' + KODE;
      if (Date.now() - parseInt(lsGet(ka) || '0', 10) > 30 * 60000) { lsSet(ka, String(Date.now())); audit(KODE, RNAMA, 'Masuk room', asli ? 'Dev membuka room (pengurus)' : 'Dev membuka room (mode lihat)'); }
    }
    $('#role').textContent = namaPeran();
    $('#role').className = 'badge' + (isDev ? ' dev' : '');
    if (!canEdit && tab === 'catat') tab = 'home';
    if (!canEdit && (sub === 'anggota' || sub === 'iuran' || sub === 'data')) sub = '';
    if (!isHost && (sub === 'pengurus' || sub === 'bayar' || sub === 'fitur')) sub = '';
    pengingat = '';
    show();
  }

  function masukRoom() {
    var k = normKode($('#rk').value), msg = $('#rmsg');
    if (!kodeSah(k)) { msg.className = 'err'; msg.textContent = 'Kode terdiri dari 6 sampai 8 huruf atau angka.'; return; }
    msg.className = 'sm'; msg.textContent = 'Mencari room…';
    fdb.collection('groups').doc(k).get().then(function (s) {
      if (!s.exists) { msg.className = 'err'; msg.textContent = 'Kode tidak ditemukan. Periksa lagi kodenya.'; return; }
      pilihRoom(k, s.data().nama);
    }).catch(function () { msg.className = 'err'; msg.textContent = 'Belum bisa menghubungi server. Cek internet.'; });
  }

  function buatRoom(tombol) {
    var u = auth && auth.currentUser, msg = $('#rmsg');
    if (!u) { msg.className = 'err'; msg.textContent = 'Masuk atau daftar akun dulu.'; return; }
    var nama = $('#rn').value.trim().replace(/\s+/g, ' ').slice(0, 40);
    if (nama.length < 3) { msg.className = 'err'; msg.textContent = 'Nama room minimal 3 huruf.'; return; }
    msg.className = 'sm'; msg.textContent = 'Membuat room…';
    tombol.disabled = true;
    var kodeBaru, periode = ($('#rp') && $('#rp').value === 'minggu') ? 'minggu' : 'bulan';
    kodeBebas(5).then(function (kode) {
      kodeBaru = kode;
      var root = fdb.collection('groups').doc(kode), b = fdb.batch();
      var roles = { label: {} };
      roles[u.uid] = 'host';
      roles.label[u.uid] = u.email || 'Host';
      b.set(root, { nama: nama, pembuat: u.uid, dibuat: Date.now() });
      b.set(root.collection('akses').doc('roles'), roles);
      return b.commit();
    }).then(function () {
      var r = ruang(kodeBaru), b2 = fdb.batch();
      b2.set(r.doc('cfg/main'), { base: periode === 'minggu' ? 5000 : 10000, naik: [], periode: periode });
      b2.set(r.collection('log').doc(), { ts: Date.now(), aksi: 'Room dibuat', ket: nama });
      return b2.commit();
    }).then(function () { pilihRoom(kodeBaru, nama); })
      .catch(function () {
        tombol.disabled = false;
        msg.className = 'err';
        msg.textContent = 'Gagal membuat room. Cek internet dan coba lagi.';
      });
  }

  /** Cek apakah masih ada data Kas Kelas versi lama (di luar room) yang belum dipindahkan. */
  function cekDataLama() {
    if (!isHost || !KODE || lsGet('kk-salin-' + KODE)) return;
    if (M.length || P.length || X.length) return;
    fdb.collection('members').limit(1).get().then(function (s) {

  /* =========================================================
   * Perhitungan iuran
   * ========================================================= */

  /** Nominal iuran yang berlaku pada bulan b ('YYYY-MM'). */
  function nominal(b) {
    var n = CFG.base || 10000;
    (CFG.naik || []).slice()
      .sort(function (a, c) { return a.dari < c.dari ? -1 : 1; })
      .forEach(function (x) { if (x.dari <= b) n = x.nominal; });
    return n;
  }

  /**
   * Hitung satu anggota. Setiap pembayaran (urut tanggal) mengisi periode paling lama dulu (FIFO):
   * tunggakan -> periode berjalan -> periode depan (baris fut). Sisa yang kurang dari satu periode
   * menjadi cicilan periode berikutnya. Anggota nonaktif tidak punya periode depan: lebihnya milik kas.
   */
  function hitung(m) {
    var skrg = cur();
    var nonaktif = m.aktif === false;
    var akhir = (nonaktif && m.selesai && m.selesai < skrg) ? m.selesai : skrg;
    var bulan = (m.mulai && m.mulai <= akhir) ? rentangBulan(m.mulai, akhir) : [];

    var pays = P.filter(function (p) { return p.mid === m.id; }).sort(function (x, y) {
      return String(x.tgl || '').localeCompare(String(y.tgl || '')) || ((x.ts || 0) - (y.ts || 0));
    });
    var bayar = sum(pays, jml)
              - sum(X.filter(function (x) { return x.mid === m.id && x.kind === 'kembali'; }), jml);

    var rows = bulan.map(function (b) { return { b: b, n: nominal(b), c: 0, tg: [], fut: false }; });
    if (!nonaktif) {
      var tot = sum(rows, function (r) { return r.n; });
      var nb = rows.length ? nextKey(rows[rows.length - 1].b) : (m.mulai || skrg), guard = 600;
      while (tot < bayar && guard-- > 0) {
        var r0 = { b: nb, n: nominal(nb), c: 0, tg: [], fut: nb > skrg };
        rows.push(r0); tot += r0.n; nb = nextKey(nb);
      }
    }

    var rem = Math.max(0, bayar), ri = 0, alok = [];
    pays.forEach(function (p) {
      var take = Math.min(p.jumlah, rem); rem -= take;
      while (take > 0 && ri < rows.length) {
        var r = rows[ri], room = r.n - r.c;
        if (room <= 0) { ri++; continue; }
        var a = Math.min(room, take);
        r.c += a; take -= a;
        if (r.tg.indexOf(p.tgl) < 0) r.tg.push(p.tgl);
        alok.push({ b: r.b, a: a, tgl: p.tgl });
        if (r.c >= r.n) ri++;
      }
    });

    var kini = rows.filter(function (r) { return !r.fut; });
    var tagih = sum(kini, function (r) { return r.n; });
    var terbayarKini = sum(kini, function (r) { return r.c; });
    var terakhir = kini[kini.length - 1];
    var sd = '';
    rows.forEach(function (r) { if (r.fut && r.c >= r.n && r.c > 0) sd = r.b; });
    var kurang = Math.max(0, tagih - terbayarKini);
    return {
      rows: rows,
      alok: alok,
      paid: bayar,
      tagih: tagih,
      kurang: kurang,
      kredit: Math.max(0, bayar - sum(rows, function (r) { return r.c; })),   // lebihan yang tak punya periode (nonaktif)
      dimuka: sum(rows.filter(function (r) { return r.fut; }), function (r) { return r.c; }),
      sd: sd,
      st: kurang === 0 ? 'lunas' : (terakhir && terakhir.c > 0 ? 'kurang' : 'belum')
    };
  }

  function derive() {
    D = M.map(function (m) { return Object.assign({}, m, hitung(m)); });
  }

  /* ----- Liquid Glass: gelembung lensa penanda tab yang meluncur dan memanjang ----- */
  var LENS = {};
  function lensKan(key, el) {
    if (!el || el.hidden) return;
    if (document.documentElement.getAttribute('data-ui') !== 'liquid-glass') { delete LENS[key]; return; }
    var b = el.querySelector('button[aria-pressed="true"]');
    if (!b) return;
    var l = document.createElement('i');
    l.className = 'lens';
    el.appendChild(l);
    var x = b.offsetLeft, w = b.offsetWidth;
    l.style.cssText = 'top:' + b.offsetTop + 'px;height:' + b.offsetHeight + 'px;left:' + x + 'px;width:' + w + 'px';
    var p = LENS[key];
    LENS[key] = { x: x, w: w };
    var diam = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (p && p.x !== x && l.animate && !diam) {
      var a = Math.min(p.x, x), z = Math.max(p.x + p.w, x + w);
      l.animate([
        { left: p.x + 'px', width: p.w + 'px', transform: 'scale(1)' },
        { left: a + 'px', width: (z - a) + 'px', transform: 'scale(1.04, 1.14)', offset: .45 },
        { left: x + 'px', width: w + 'px', transform: 'scale(1)' }
      ], { duration: 560, easing: 'cubic-bezier(.3, 1.25, .5, 1)' });
    }
  }
  /** Geser gelembung dengan jari; saat dilepas, pindah ke tab terdekat. */
  function lensGeser(sel) {
    var el = $(sel), st = null;
    if (!el) return;
    el.addEventListener('pointerdown', function (e) {
      var l = el.querySelector('.lens');
      if (document.documentElement.getAttribute('data-ui') !== 'liquid-glass' || !l) return;
      st = { x0: e.clientX, l: l, left0: l.offsetLeft, drag: false };
    });
    el.addEventListener('pointermove', function (e) {
      if (!st) return;
      var dx = e.clientX - st.x0;
      if (!st.drag && Math.abs(dx) > 8) {
        st.drag = true;
        try { el.setPointerCapture(e.pointerId); } catch (x) {}
        if (st.l.getAnimations) st.l.getAnimations().forEach(function (a) { a.cancel(); });
      }
      if (st.drag) {
        var bs = el.querySelectorAll('button'), first = bs[0], last = bs[bs.length - 1];
        var max = last.offsetLeft + last.offsetWidth - st.l.offsetWidth;
        st.l.style.left = Math.max(first.offsetLeft, Math.min(max, st.left0 + dx)) + 'px';
        st.l.style.transform = 'scale(1.08, 1.14)';
      }
    });
    function selesai() {
      if (!st) return;
      var s0 = st; st = null;
      if (!s0.drag) return;
      var c = s0.l.offsetLeft + s0.l.offsetWidth / 2, best = null, d = 1e9;
      el.querySelectorAll('button').forEach(function (b) {
        var m = Math.abs(b.offsetLeft + b.offsetWidth / 2 - c);
        if (m < d) { d = m; best = b; }
      });
      s0.l.style.transform = '';
      if (best && best.getAttribute('aria-pressed') !== 'true') best.click();
      else if (best) { s0.l.style.left = best.offsetLeft + 'px'; }
    }
    el.addEventListener('pointerup', selesai);
    el.addEventListener('pointercancel', selesai);
  }

                '<a class="btn" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(pengingat) + '">Kirim lewat WhatsApp</a></div>'
              : '<button class="btn ghost" type="button" data-a="rem">Buat pesan pengingat</button>') +
          '</div>'
        : '') +
      '<div class="card"><h2>Pengeluaran terakhir</h2>' +
        (pengeluaran || '<p class="sm">Belum ada pengeluaran.</p>') +
      '</div>';
  }

  /** Kartu "Cara bayar": nomor baru tampil setelah tiga lapis pengingat. */
  function kartuBayar() {
    if (!BAYAR || !BAYAR.nomor) {
      return isHost ? '<div class="card c-bayar"><h2>Cara bayar</h2><p class="sm">Belum diatur. Atur di Pengaturan &gt; Cara bayar.</p></div>' : '';
    }
    var l = bayarLangkah, h = '<div class="card c-bayar"><h2>Cara bayar kas</h2>';
    var info = '<p class="sm">Dompet digital: <b>' + esc(BAYAR.dompet) + '</b>' + (BAYAR.an ? ' \u00b7 a.n. ' + esc(BAYAR.an) : '') +
      '<br>Terakhir diubah ' + esc(lalu(BAYAR.ts)) + '</p>';
    var LANGKAH = [
      ['Pastikan tujuannya benar', 'Cocokkan nama dompet dan nama pemilik dengan yang diumumkan bendahara. Kalau ada yang berbeda, jangan transfer dulu dan tanyakan langsung ke bendahara.'],
      ['Simpan bukti pembayaran', 'Setelah transfer, screenshot bukti pembayarannya dan simpan sampai kasmu tercatat di aplikasi.'],
      ['Konfirmasi ke bendahara', 'Kirim atau tunjukkan bukti itu langsung ke bendahara. Kas baru tercatat setelah bendahara mengonfirmasi, jadi jangan menganggap sudah lunas sebelum itu.']
    ];
    if (l === 0) {
      h += info + '<button class="btn" type="button" data-a="byb">Lihat nomor</button><p class="sm">Ada tiga pengingat singkat sebelum nomor ditampilkan.</p>';
    } else if (l <= 3) {
      var s = LANGKAH[l - 1];
      h += info + '<div class="alert"><b>' + l + ' dari 3 &middot; ' + s[0] + '</b><br>' + s[1] + '</div>' +
        (l === 3 ? '<label class="sm" style="display:flex;gap:8px;align-items:center"><input id="bysetuju" type="checkbox" style="width:auto;min-height:0"> Saya mengerti dan akan konfirmasi ke bendahara</label>' : '') +
        '<div class="row"><button class="btn ghost" type="button" data-a="byx">Batal</button>' +
        '<button class="btn" type="button" data-a="byn">' + (l === 3 ? 'Tampilkan nomor' : 'Lanjut') + '</button></div><p id="bymsg" class="err"></p>';
    } else {
      h += info + '<div class="kv"><span>Nomor ' + esc(BAYAR.dompet) + '</span><b class="mono" style="font-size: calc(1.15rem * var(--fz, 1));word-break:break-all">' + esc(BAYAR.nomor) + '</b></div>' +
        '<div class="row"><button class="btn" type="button" data-a="bys">Salin nomor</button><button class="btn ghost" type="button" data-a="byx">Sembunyikan</button></div>' +
        '<p class="sm">Setelah transfer: simpan screenshot bukti dan konfirmasi langsung ke bendahara.</p>';
    }
    return h + '</div>';
  }

  /* =========================================================
   * Tab: Anggota
   * ========================================================= */
  function chipStatus(m) {
    if (m.aktif === false) return '<span class="chip off">Nonaktif</span>';
    return m.st === 'lunas' && m.sd
      ? '<span class="chip lunas">Lunas (s.d. ' + esc(akhirLabel(m.sd)) + ')</span>'
      : '<span class="chip ' + m.st + '">' + kap(m.st) + '</span>';
  }

  function fAnggota() {
    var f = q.toLowerCase();
    var L = D.filter(function (m) {
      if (filt === 'belum' && !(isAktif(m) && m.kurang > 0)) return false;
      if (filt === 'lunas' && !(isAktif(m) && m.kurang === 0)) return false;
      if (filt === 'off' && isAktif(m)) return false;
      return !f || m.nama.toLowerCase().indexOf(f) > -1 || String(m.nim || '').indexOf(f) > -1;
    });
    L.sort(urut);
    $('#cnt').textContent = L.length === D.length ? D.length + ' anggota' : L.length + ' dari ' + D.length + ' anggota';

    var html = L.map(function (m) {
      var row =
        '<div class="m" data-s="' + m.id + '">' +
          '<div><b>' + esc(m.nama) + '</b><small>' + esc(m.nim || 'tanpa NIM') + '</small></div>' +
          '<div style="text-align:right">' + chipStatus(m) +
            (m.kurang > 0 && isAktif(m) ? '<div class="sm mono">kurang ' + rp(m.kurang) + '</div>' : '') +
          '</div>' +
        '</div>';
      return sel === m.id ? row + detail(m) : row;
    }).join('');

    $('#list').innerHTML = html ||
      '<p class="sm">' + (M.length ? 'Tidak ada yang cocok.' : 'Belum ada anggota.' + (canEdit ? ' Ketuk Tambah atau impor anggota di bawah.' : '')) + '</p>';
  }

  function detail(m) {
    var bayar = P.filter(function (p) { return p.mid === m.id; }).sort(terbaru);

    var tabel = '<div style="overflow-x:auto"><table><tr><th>' + (MINGGU() ? 'Minggu' : 'Bulan') + '</th><th>Tagihan</th><th>Terbayar</th><th>Tgl bayar</th></tr>' +
      m.rows.slice().reverse().map(function (r) {
        var muka = r.tg.some(function (t) { return kunci(t) < r.b; });
        return '<tr><td>' + bln(r.b) + '</td><td class="mono">' + rp(r.n) + '</td>' +
               '<td class="mono ' + (r.c >= r.n ? 'in' : 'out') + '">' + rp(r.c) +
                 (r.c < r.n ? '<span class="dm" style="color:var(--out)">Kurang ' + rp(r.n - r.c) + '</span>' : '') + '</td>' +
               '<td class="sm">' + (r.tg.length ? r.tg.map(tglByr).join(', ') : '-') +
                 (muka ? '<span class="dm">(Bayar di muka)</span>' : '') + '</td></tr>';
      }).join('') + '</table></div>';

    var info = '<p class="sm">Mulai ditagih: ' + (m.mulai ? bln(m.mulai) : '-') +
      (m.selesai ? ' &middot; berhenti: ' + bln(m.selesai) : '') + '</p>';

    var riwayat = bayar.map(function (p) {
      if (ed && ed.a === 'ep' && ed.id === p.id) return editForm({ id: p.id, t: 'in', ket: m.nama });
      return '<div class="pv hv"><span>' + esc(p.tgl) + '</span><span class="mono in">' + rp(p.jumlah) + '</span>' +
        (canEdit
          ? '<span class="acts"><button class="btn ghost sm2" data-a="ep" data-id="' + p.id + '">Ubah</button>' +
              '<button class="btn ghost sm2 del" data-a="dp" data-id="' + p.id + '">' +
              (armed === 'dp' + p.id ? 'Yakin?' : 'Hapus') + '</button></span>'
          : '') +
        '</div>';
    }).join('');
    var h = '<div class="det">' + tabel + info + riwayat;
    if (canEdit) {
      h += blokEdit(m, bayar.length > 0 || IP.some(function (z) { return z.mid === m.id; }),
        m.aktif === false && m.kredit > 0 ? '<p class="sm">Lebihan ' + rp(m.kredit) + ' masuk ke kas karena anggota ini nonaktif.</p>' : '');
    }
    return h + '</div>';
  }

  /** Semua aksi tombol & ketukan baris di dalam #view. */
  $('#view').addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g) { sub = g.dataset.go; PV = []; fSet(); window.scrollTo(0, 0); return; }

    var b = e.target.closest('button[data-a], button[data-t], button[data-u], button[data-lf], button[data-kat], button[data-ui]');

    if (!b) {
      var r = e.target.closest('[data-s]');
      if (r) { sel = (sel === r.dataset.s) ? null : r.dataset.s; memEd = null; ed = null; edBuka = ''; gambarAnggota(); }
      return;
    }

    var a = b.dataset.a, id = b.dataset.id;

    // aksi yang boleh dipakai siapa saja
    if (a === 'sback') {
      if (sub) { sub = ''; fSet(); } else { tab = prevTab; show(); }
      window.scrollTo(0, 0);
      return;
    }
    if (a === 'in') { bukaLogin(); return; }
    var th = b.dataset.t, uk = b.dataset.u;
    if (b.dataset.kat !== undefined) { uiKat = (uiKat === b.dataset.kat) ? '' : b.dataset.kat; fSet(); return; }
    if (b.dataset.ui) { lsSet('kk-ui', b.dataset.ui); fSet(); return; }
    if (th) { lsSet('kk-tema', th); fSet(); return; }
    if (uk) { lsSet('kk-ukuran', uk); fSet(); return; }
    if (b.dataset.lf !== undefined) { lf = b.dataset.lf; gambarLaporan(); return; }

    if (a === 'out') { if (arm('out')) auth.signOut(); return; }
    if (a === 'ckd') { salin(KODE, b); return; }
    if (a === 'ctl') { salin(location.origin + location.pathname + '?r=' + KODE, b); return; }
    if (a === 'byb') { bayarLangkah = 1; fill(); return; }
    if (a === 'byx') { bayarLangkah = 0; fill(); return; }
    if (a === 'byn') {
      if (bayarLangkah === 3 && !($('#bysetuju') && $('#bysetuju').checked)) { $('#bymsg').textContent = 'Centang dulu bahwa kamu mengerti.'; return; }
      bayarLangkah++; fill(); return;
    }
    if (a === 'bys') { if (BAYAR) salin(BAYAR.nomor, b); return; }
    if (a === 'cuid') { salin(auth.currentUser.uid, b); return; }
    if (a === 'dve' && isDev) {
      devEdit = !devEdit;
      audit(KODE, RNAMA, devEdit ? 'Aktifkan edit' : 'Matikan edit', 'Mode edit Dev');
      terapkanPeran(); return;
    }
    if (a === 'dvm' && isDev) { bukaPanel(id); return; }
    if (a === 'dvb' && isDev) { unduhRoom(id); return; }
    if (a === 'dvr' && isDev) { pulihRoom(); return; }
    if (a === 'dh' && isDev) { dhKode = id; tampilSemuaRoom(); return; }
    if (a === 'dhx' && isDev) { dhKode = ''; tampilSemuaRoom(); return; }
    if (a === 'dh2' && isDev) {
      if (normKode($('#dk').value) !== id) { $('#dhm').className = 'err'; $('#dhm').textContent = 'Kode tidak cocok.'; return; }
      hapusRoom(id); return;
    }
    if (a === 'gr') { var rr = daftarRoom().filter(function (x) { return x.kode === id; })[0]; pilihRoom(id, (rr && rr.nama) || b.getAttribute('data-nm')); return; }
    if (a === 'jr') { masukRoom(); return; }
    if (a === 'br') { buatRoom(b); return; }
    if (a === 'kroom') {
      if (!arm('kroom')) return;
      lupakanRoom(KODE); lsSet('kk-room-aktif', ''); muatUlang();
      return;
    }

    if (a === 'ibo') { iSel = id; fill(); window.scrollTo(0, 0); return; }
    if (a === 'ibk') { iSel = ''; fill(); window.scrollTo(0, 0); return; }
    if (a === 'ibu') { unduhRekapIB(id); return; }
    if (a === 'ibua') { unduhRekapSemuaIB(); return; }
    if (a === 'ibr') { var ir = IUR.filter(function (x) { return x.id === id; })[0]; if (ir) salin(teksRingkasIB(ir), b); return; }

    if (!db || !canEdit) return;
    if (a === 'pen') { edBuka = (edBuka === id) ? '' : id; memEd = null; gambarAnggota(); return; }
    if (a === 'fsim' && isHost) { simpanFitur(); return; }
    if (a === 'ibc') { qPre = iSel; tab = 'catat'; show(); window.scrollTo(0, 0); return; }
    if (a === 'ibt') { tutupIB(id); return; }
    if (a === 'ibh' && isHost) { hapusIB(id); return; }
    if (a === 'ibp') { hapusBayarIB(id); return; }
    if (a === 'ibx') { hapusKeluarIB(id); return; }
    if (a === 'xj') { unduhCadangan(); return; }
    if (a === 'xc') { unduhRekap(); return; }
    if (a === 'sl' && isHost) { salinDataLama(b); return; }
    if (a === 'pad' && isHost) { tambahPengurus(); return; }
    if (a === 'prm' && isHost) { hapusPengurus(id); return; }
    if (a === 'thost' && isHost) { alihHost(id); return; }
    var m = D.find(function (x) { return x.id === id; });

    if (a === 'kel') { openSet('anggota'); return; }
    if (a === 'more') { histN += 20; fill(); return; }
    if (a === 'rem') { pengingat = teksPengingat(); fHome(); return; }
    if (a === 'rcp') {
      var area = $('#rt');
      if (area) area.select();
      try { navigator.clipboard.writeText(pengingat); } catch (er) { document.execCommand('copy'); }
      b.textContent = 'Tersalin';
      return;
    }
    if (a === 'aok') { tambahAnggota(); return; }
    if (a === 'ipr') { pratinjauImpor(); return; }
    if (a === 'iok') { jalankanImpor(); return; }
    if (a === 'iun') { batalkanImpor(); return; }
    if (a === 'cok') { ubahIuran(); return; }
    if (a === 'bsim' && isHost) { simpanBayar(); return; }
    if (a === 'bhap' && isHost) { hapusBayar(); return; }
    if (a === 'sb') { ubahBase(); return; }
    if (a === 'dn') { hapusNaik(id); return; }

    if (a === 'sv') {
      var nama = $('#en').value.trim().replace(/\s+/g, ' ');
      var nim = $('#ei').value.trim();
      if (!nama) { $('#emsg').textContent = 'Nama tidak boleh kosong.'; return; }
      if (nimDipakai(nim, id)) { $('#emsg').textContent = 'NIM itu sudah dipakai anggota lain.'; return; }
      memEd = null; edBuka = '';
      simpan(function (bt) { bt.update(db.doc('members/' + id), { nama: nama, nim: nim }); },
        'Ubah anggota', m.nama + ' (NIM ' + (m.nim || '-') + ') menjadi ' + nama + ' (NIM ' + (nim || '-') + ')');
    }

    if (a === 'tg') {
      edBuka = '';
      var aktifkan = (m.aktif === false);
      simpan(function (bt) { bt.update(db.doc('members/' + id), aktifkan ? { aktif: true, selesai: null } : { aktif: false, selesai: cur() }); },
        'Status anggota', m.nama + (aktifkan ? ' diaktifkan' : ' dinonaktifkan'));
    }

    if (a === 'dp') {
      if (!arm('dp' + id)) return;
      var p = P.find(function (x) { return x.id === id; });
      if (!p) return;
      var pm = M.find(function (x) { return x.id === p.mid; }) || {};
      simpan(function (bt) { bt.delete(db.doc('pay/' + id)); }, 'Hapus kas', (pm.nama || '?') + ' ' + rp(p.jumlah) + ' tgl ' + p.tgl);
    }

    if (a === 'dx') {
      if (!arm('dx' + id)) return;
      var x = X.find(function (z) { return z.id === id; });
      if (!x) return;
      simpan(function (bt) { bt.delete(db.doc('exp/' + id)); }, x.kind === 'masuk' ? 'Hapus pemasukan lain' : 'Hapus catatan keluar', x.ket + ' ' + rp(x.jumlah));
    }

    if (a === 'ep' || a === 'ex') {
      var rec = (a === 'ep' ? P : X).find(function (r) { return r.id === id; });
      if (!rec) return;
      armed = '';
      ed = { a: a, id: id, tgl: rec.tgl || today(), jml: Number(rec.jumlah).toLocaleString('id-ID'), ket: rec.ket || '' };
      fill();
    }

    if (a === 'hb') { ed = null; fill(); }
    if (a === 'hs') simpanUbah(id);

    if (a === 'dm') {
      if (!arm('dm' + id)) return;
      sel = null;
      simpan(function (bt) { bt.delete(db.doc('members/' + id)); }, 'Hapus anggota', m.nama);
    }
  });

  /* =========================================================
   * Anggota: tambah, impor, iuran, pengingat
   * ========================================================= */
  function tambahAnggota() {
    var nama = $('#an').value.trim().replace(/\s+/g, ' ');
    var nim = $('#ai').value.trim();
    var mulai = kunci($('#am').value);
    var msg = $('#amsg');
    if (!nama || !mulai) { msg.className = 'err'; msg.textContent = 'Isi nama dan ' + (MINGGU() ? 'tanggal' : 'bulan') + ' mulai.'; return; }
    if (nimDipakai(nim)) { msg.className = 'err'; msg.textContent = 'NIM itu sudah dipakai.'; return; }
    msg.className = 'sm';
    msg.textContent = 'Menyimpan…';
    $('#an').value = $('#ai').value = '';
    simpan(function (b) { b.set(db.collection('members').doc(), { nama: nama, nim: nim, mulai: mulai, aktif: true, ts: Date.now() }); },
      'Tambah anggota', nama).then(function (ok) {
      msg.className = ok ? 'ok' : 'err';
      msg.textContent = ok ? nama + ' ditambahkan.' : 'Gagal menyimpan. Isi lagi dan coba ulang.';
    });
  }

  function samar(n) { n = String(n || ''); return '…' + n.slice(-3); }   // nomor tidak boleh bocor ke Riwayat
  function simpanBayar() {
    var d = ($('#bd').value || '').trim(), n = ($('#bn').value || '').replace(/\D/g, ''), an = ($('#ba').value || '').trim(), msg = $('#bmsg');
    if (!d || n.length < 5) { msg.textContent = 'Isi nama dompet dan nomor (minimal 5 angka).'; return; }
    if (BAYAR && BAYAR.dompet === d && BAYAR.nomor === n && (BAYAR.an || '') === an) { msg.textContent = 'Tidak ada yang berubah.'; return; }
    msg.textContent = '';
    var lama = BAYAR && BAYAR.nomor ? BAYAR.dompet + ' ' + samar(BAYAR.nomor) + ' menjadi ' : '';
    bayarLangkah = 0;
    simpan(function (b) { b.set(db.doc('cfg/bayar'), { dompet: d, nomor: n, an: an, ts: Date.now() }); },
      lama ? 'Ubah cara bayar' : 'Atur cara bayar', lama + d + ' ' + samar(n));
  }
  function hapusBayar() {
    if (!BAYAR || !arm('bhap')) return;
    var d = BAYAR.dompet;
    bayarLangkah = 0;
    simpan(function (b) { b.delete(db.doc('cfg/bayar')); }, 'Hapus cara bayar', d);
  }

  function ubahIuran() {
    var v = num($('#cn').value), m = kunci($('#cm').value);
    if (!v || !m) return;
    var naik = (CFG.naik || []).filter(function (x) { return x.dari !== m; });
    naik.push({ dari: m, nominal: v });
    $('#cn').value = '';
    simpan(function (b) { b.set(db.doc('cfg/main'), Object.assign({}, CFG, { naik: naik })); },
      'Ubah nominal kas', rp(v) + ' mulai ' + bln(m));
  }

  function ubahBase() {
    var v = num($('#cb').value);
    if (!v) return;
    $('#cb').value = '';
    simpan(function (b) { b.set(db.doc('cfg/main'), Object.assign({}, CFG, { base: v })); },
      'Ubah kas awal', rp(CFG.base || 10000) + ' menjadi ' + rp(v));
  }

  function hapusNaik(dari) {
    if (!arm('dn' + dari)) return;
    var naik = (CFG.naik || []).filter(function (x) { return x.dari !== dari; });
    simpan(function (b) { b.set(db.doc('cfg/main'), Object.assign({}, CFG, { naik: naik })); },
      'Hapus kenaikan kas', 'mulai ' + bln(dari));
  }

  function teksPengingat() {
    var belum = D.filter(function (m) { return isAktif(m) && m.kurang > 0; }).sort(urut);
    return belum.length
      ? 'Pengingat kas (' + bln(cur()) + '). Yang belum lunas:\n' +
        belum.map(function (m, i) {
          return (i + 1) + '. ' + m.nama + (m.nim ? ' (' + m.nim + ')' : '') + ' - kurang ' + rp(m.kurang);
        }).join('\n') + (BAYAR && BAYAR.nomor ? '\nCara bayar: lihat di aplikasi, lalu konfirmasi ke bendahara dengan bukti transfer.' : '') + '\nTerima kasih.'
      : 'Semua anggota sudah lunas.';
  }

  /* ----- Impor massal ----- */
  function parseImpor(teks) {
    return teks.split(/\r?\n/)
      .map(function (l) { return l.trim(); })
      .filter(Boolean)
      .map(function (l) {
        l = l.replace(/^\d{1,3}[.)]\s+/, '');                 // buang nomor urut
        var cocok = l.match(/\d{5,}/);
        var nim = cocok ? cocok[0] : '';
        var nama = l.replace(nim, '')
          .replace(/[\t,;|]+/g, ' ')
          .replace(/\s[-–]\s/g, ' ')
          .replace(/\s+/g, ' ').trim().toLowerCase()
          .replace(/(^|[\s-])\S/g, function (s) { return s.toUpperCase(); });
        return { nama: nama, nim: nim };
      });
  }

  function pratinjauImpor() {
    var seen = {};
    PV = parseImpor($('#ib').value).map(function (r) {
      var s = 'ok', w = '';
      if (r.nim && (nimDipakai(r.nim) || seen[r.nim])) { s = 'bad'; w = 'NIM kembar'; }
      else if (!r.nim || !r.nama) { s = 'warn'; w = !r.nim ? 'NIM kosong' : 'Nama kosong'; }
      else if (M.some(function (m) { return m.nama.toLowerCase() === r.nama.toLowerCase(); })) { s = 'warn'; w = 'Mungkin dobel'; }
      if (r.nim) seen[r.nim] = 1;
      r.s = s; r.w = w;
      return r;
    }).sort(byNama);

    var hitungStatus = function (s) { return PV.filter(function (r) { return r.s === s; }).length; };
    var kelas = { ok: 'lunas', warn: 'kurang', bad: 'belum' };
    var label = { ok: 'siap', warn: 'cek', bad: 'salah' };

    $('#ipv').innerHTML =
      '<p class="sm"><b>' + hitungStatus('ok') + ' siap, ' + hitungStatus('warn') + ' perlu dicek, ' +
      hitungStatus('bad') + ' bermasalah.</b> Baris bermasalah dilewati.</p>' +
      PV.map(function (r) {
        return '<div class="pv"><span class="chip ' + kelas[r.s] + '">' + label[r.s] + '</span>' +
               '<span>' + esc(r.nama || '(tanpa nama)') + '</span><span class="mono">' + esc(r.nim) + '</span>' +
               '<span class="sm">' + r.w + '</span></div>';
      }).join('');

    $('#iok').hidden = !PV.some(function (r) { return r.s !== 'bad' && r.nama; });
  }

  function jalankanImpor() {
    var batch = Date.now(), mulai = kunci($('#im').value);
    var ok = PV.filter(function (r) { return r.s !== 'bad' && r.nama; });
    var im = $('#imsg');
    if (!mulai || !ok.length) return;

  /** Simpan perubahan satu catatan (tanggal, jumlah, keperluan). Anggota tidak bisa diganti. */
  function simpanUbah(id) {
    if (!ed || ed.id !== id) return;
    var isPay = ed.a === 'ep';
    var rec = (isPay ? P : X).find(function (r) { return r.id === id; });
    if (!rec) { ed = null; fill(); return; }

    var t = $('#htg').value, j = num($('#hjm').value);
    var k = isPay ? '' : $('#hkt').value.trim().replace(/\s+/g, ' ');
    if (!t || !j || (!isPay && !k)) {
      $('#hmsg').textContent = isPay ? 'Isi tanggal dan jumlah.' : 'Isi keperluan, tanggal, dan jumlah.';
      return;
    }

    var ubah = [];
    if (t !== rec.tgl) ubah.push('tgl ' + rec.tgl + ' menjadi ' + t);
    if (j !== rec.jumlah) ubah.push(rp(rec.jumlah) + ' menjadi ' + rp(j));
    if (!isPay && k !== rec.ket) ubah.push('keperluan "' + rec.ket + '" menjadi "' + k + '"');

    ed = null;
    if (ubah.length) {
      if (isPay) {
        var pm = M.find(function (m) { return m.id === rec.mid; }) || {};
        simpan(function (bt) { bt.update(db.doc('pay/' + id), { tgl: t, jumlah: j }); }, 'Ubah kas', (pm.nama || '?') + ': ' + ubah.join('; '));
      } else {
        simpan(function (bt) { bt.update(db.doc('exp/' + id), { tgl: t, ket: k, jumlah: j }); }, rec.kind === 'masuk' ? 'Ubah pemasukan lain' : 'Ubah catatan keluar', rec.ket + ': ' + ubah.join('; '));
      }
    }
    fill();
  }

  /* =========================================================
   * Tab: Laporan
   * ========================================================= */
  function fLaporan() {
    var skrg = cur();
    var lainTotal = sum(X.filter(function (x) { return x.kind === 'masuk'; }), jml);
    var total = sum(P, jml) + lainTotal - sum(X.filter(function (x) { return x.kind !== 'masuk'; }), jml);   // = saldo Beranda
    var per = {};
    var at = function (k) { return per[k] || (per[k] = { i: 0, o: 0, fwd: 0, muka: 0 }); };
    P.forEach(function (p) { var k = kunci(p.tgl); if (k) at(k).i += p.jumlah; });
    X.forEach(function (x) {
      var k = kunci(x.tgl); if (!k) return;
      if (x.kind === 'masuk') at(k).i += x.jumlah; else at(k).o += x.jumlah;
    });
    // alokasi pembayaran ke periode yang lebih baru dari tanggal bayarnya = "di muka"
    D.forEach(function (m) {
      (m.alok || []).forEach(function (z) {
        var kp = kunci(z.tgl);
        if (kp && kp < z.b) { at(kp).fwd += z.a; at(z.b).muka += z.a; }
      });
    });
    if (Object.keys(per).length) at(skrg);

    var run = 0;
    var baris = Object.keys(per).sort().map(function (k) {
      var o = per[k], depan = k > skrg, kini = k === skrg;
      if (!depan) run += o.i - o.o;
      return '<tr><td>' + bln(k) + (kini ? '<span class="dm" style="color:var(--muted)">berjalan</span>' : (depan ? '<span class="dm" style="color:var(--muted)">akan datang</span>' : '')) + '</td>' +
        '<td class="mono in">' + rp(o.i - o.fwd) + (o.muka > 0 ? '<span class="dm">+' + rp(o.muka) + ' (di muka)</span>' : '') + '</td>' +
        (depan
          ? '<td class="mono">-</td><td class="mono">-</td>'
          : '<td class="mono out">' + rp(o.o) + '</td><td class="mono">' + rp(kini ? total : run) + '</td>') + '</tr>';
    }).reverse().join('');

    var KAT = [['', 'Semua'], ['keuangan', 'Keuangan'], ['anggota', 'Anggota'], ['pengurus', 'Pengurus'], ['batal', 'Dibatalkan']];
    var riwayat = LOG.filter(function (l) { return !lf || (l.kat || kategori(l.aksi)) === lf; }).map(function (l) {
      return '<div class="pv hs"><span class="sm wk">' + waktuLog(l.ts) + '</span><span><b>' + esc(l.aksi) + '</b>: ' + esc(l.ket) + '</span></div>';
    }).join('');

    $('#rep').innerHTML =
      '<div class="card"><h2>Rekap ' + (MINGGU() ? 'mingguan' : 'bulanan') + '</h2><div style="overflow-x:auto"><table>' +
        '<tr><th>' + (MINGGU() ? 'Minggu' : 'Bulan') + '</th><th>Masuk</th><th>Keluar</th><th>Saldo</th></tr>' +
        (baris || '<tr><td colspan="4" class="sm">Belum ada data.</td></tr>') +
      '</table></div>' +
      '<p class="sm">Masuk = uang yang dibayar pada ' + SATUAN() + ' itu; tulisan biru kecil = bagian yang sudah dibayar lebih awal untuk ' + SATUAN() + ' itu. Saldo ' + SATUAN() + ' berjalan = seluruh uang di tangan bendahara (termasuk bayar di muka).</p>' +
      (lainTotal > 0 ? '<p class="sm">Kolom Masuk sudah termasuk pemasukan lain (hadiah, donasi) sebesar ' + rp(lainTotal) + '.</p>' : '') +
      '</div>' +
      '<div class="card"><h2>Riwayat perubahan</h2>' +
        '<p class="sm">Jejak 100 perubahan terakhir, termasuk yang dibatalkan. Angka kas dihitung dari data yang berlaku.</p>' +
        '<div class="chips">' + KAT.map(function (k) {
          return '<button type="button" data-lf="' + k[0] + '" aria-pressed="' + (lf === k[0]) + '">' + k[1] + '</button>';
        }).join('') + '</div>' +
        (riwayat || '<p class="sm">Tidak ada catatan di kelompok ini.</p>') + '</div>';
  }

  /** Hitungan satu iuran: peserta = anggota aktif (plus yang sudah membayar), terkumpul, lunas. */
  function ringI(i) {
    var pay = IP.filter(function (x) { return x.iid === i.id; }), byM = {}, ids = {};
    pay.forEach(function (p) { byM[p.mid] = (byM[p.mid] || 0) + p.jumlah; ids[p.mid] = 1; });
    M.forEach(function (m) { if (isAktif(m)) ids[m.id] = 1; });
    var rows = Object.keys(ids).map(function (id) {
      var m = M.find(function (x) { return x.id === id; });
      if (!m) return null;
      var c = byM[id] || 0;
      return { m: m, c: c, st: i.per > 0 ? (c >= i.per ? 'lunas' : (c > 0 ? 'kurang' : 'belum')) : (c > 0 ? 'lunas' : 'belum') };
    }).filter(Boolean).sort(function (a, b) { return byNama(a.m, b.m); });
    var keluar = sum(IX.filter(function (x) { return x.iid === i.id; }), jml), kumpul = sum(pay, jml);
    return {
      rows: rows, pay: pay, n: rows.length,
      keluar: keluar, sisa: kumpul - keluar,
      terkumpul: kumpul,
      target: i.per > 0 ? i.per * rows.length : 0,
      lunas: rows.filter(function (r) { return r.st === 'lunas'; }).length
    };
  }

  /* ---- Anggota ---- */

    buka.forEach(function (i) {

      if (sortBy === 'nim') return String(a.nim || '').localeCompare(String(b.nim || ''), 'id', { numeric: true }) || byNama(a, b);
