  }
  function namaRoomDv(kode) { var r = (DVLIST || []).filter(function (x) { return x.kode === kode; })[0]; return r ? r.nama : kode; }

  /** Cadangan satu room ke file JSON. */
  function unduhRoom(kode) {
    note('Menyiapkan cadangan…');
    muatInfo(kode).then(function (o) {
      var one = function (c) { return (o[c.n] || []).filter(function (x) { return c.id ? x.id === c.id : true; }); };
      var isi = {
        versi: 3, kode: kode, nama: o.meta.nama || kode, pembuat: o.meta.pembuat || '', dibuat: o.meta.dibuat || 0, waktu: new Date().toISOString(),
        akses: (one({ n: 'akses', id: 'roles' })[0] || {}).d || null,
        cfg: (one({ n: 'cfg', id: 'main' })[0] || {}).d || null,
        bayar: (one({ n: 'cfg', id: 'bayar' })[0] || {}).d || null,
        fitur: (one({ n: 'cfg', id: 'fitur' })[0] || {}).d || null,
        members: o.members, pay: o.pay, exp: o.exp, log: o.log, iur: o.iur, ipay: o.ipay, iexp: o.iexp
      };
      unduh('kas-' + kode.toLowerCase() + '-cadangan-' + today() + '.json', JSON.stringify(isi, null, 1), 'application/json');
      audit(kode, o.meta.nama, 'Unduh cadangan', o.members.length + ' anggota, ' + o.pay.length + ' catatan kas');
      note('Cadangan ' + kode + ' diunduh.');
      muatAudit();
    }).catch(function () { note('Gagal membuat cadangan.', 'red'); });
  }

  /** Pulihkan room dari file cadangan. */
  function bacaCadangan() {
    var f = $('#dvf') && $('#dvf').files[0], pv = $('#dvPv');
    dvPulih = null;
    if (!f || !pv) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var d = JSON.parse(fr.result);
        if (d.versi !== 3 || !kodeSah(d.kode) || typeof d.nama !== 'string' || !Array.isArray(d.members)) throw new Error('x');
        dvPulih = d;
        var ada = (DVLIST || []).some(function (r) { return r.kode === d.kode; });
        pv.innerHTML = '<div class="det"><p class="sm"><b>' + esc(d.nama) + '</b> (' + esc(d.kode) + ')<br>' + d.members.length + ' anggota, ' + (d.pay || []).length + ' catatan kas, ' + (d.exp || []).length + ' catatan lain, ' + (d.log || []).length + ' riwayat.</p>' +
          (ada ? '<p class="err">Room ini masih ada. Data dengan id sama akan ditimpa, riwayat yang sudah ada tidak diubah.</p>' : '<p class="sm">Room ini akan dibuat kembali.</p>') +
          '<button class="btn" type="button" data-a="dvr">Pulihkan</button><p id="dvPm" class="sm"></p></div>';
      } catch (e) { pv.innerHTML = '<p class="err">File bukan cadangan room Kaskita yang sah.</p>'; }
    };
    fr.readAsText(f);
  }
  function pulihRoom() {
    var d = dvPulih, pm = $('#dvPm');
    if (!d || !pm) return;
    var kode = d.kode, root = fdb.collection('groups').doc(kode);
    pm.className = 'sm'; pm.textContent = 'Memulihkan…';
    root.collection('log').get().then(function (ls) {
      var ada = {}; ls.docs.forEach(function (x) { ada[x.id] = 1; });
      var ops = [[root, { nama: d.nama, pembuat: d.pembuat, dibuat: d.dibuat }]];
      if (d.akses) ops.push([root.collection('akses').doc('roles'), d.akses]);
      if (d.cfg) ops.push([root.collection('cfg').doc('main'), d.cfg]);
      if (d.bayar) ops.push([root.collection('cfg').doc('bayar'), d.bayar]);
      if (d.fitur) ops.push([root.collection('cfg').doc('fitur'), d.fitur]);
      ['members', 'pay', 'exp', 'iur', 'ipay', 'iexp'].forEach(function (c) { (d[c] || []).forEach(function (x) { ops.push([root.collection(c).doc(x.id), x.d]); }); });
      (d.log || []).forEach(function (x) { if (!ada[x.id]) ops.push([root.collection('log').doc(x.id), x.d]); });
      ops.push([fdb.collection('audit').doc(), { ts: Date.now(), kode: kode, nama: d.nama, aksi: 'Pulihkan room', ket: d.members.length + ' anggota' }]);
      var p = Promise.resolve();
      for (var i = 0; i < ops.length; i += 400) {
        (function (potong) {
          p = p.then(function () { var bt = fdb.batch(); potong.forEach(function (o) { bt.set(o[0], o[1]); }); return bt.commit(); });
        })(ops.slice(i, i + 400));
      }
      return p.then(function () { return ops.length; });
    }).then(function (n) {
      simpanRoom(kode, d.nama);
      if (!(DVLIST || []).some(function (r) { return r.kode === kode; })) { DVLIST = (DVLIST || []).concat([{ kode: kode, nama: d.nama }]); }
      delete dvInfo[kode]; dvPulih = null;
      tampilSemuaRoom(); muatAudit();
      var el = $('#dvPm'); if (el) { el.className = 'ok'; el.textContent = 'Room ' + kode + ' dipulihkan (' + n + ' dokumen).'; }
    }).catch(function () {
      var el = $('#dvPm'); if (el) { el.className = 'err'; el.textContent = 'Gagal memulihkan. Pastikan aturan Firestore versi terbaru sudah dipublikasikan.'; }
    });
  }

  /** Hapus satu room beserta seluruh isinya (subkoleksi dulu, baru dokumen room). */
  function hapusRoom(kode) {
    var msg = $('#dhm'), root = fdb.collection('groups').doc(kode), nama = namaRoomDv(kode);
    msg.className = 'sm'; msg.textContent = 'Menghapus…';
    var n = 0;
    var p = audit(kode, nama, 'Hapus room', 'Room dihapus permanen') || Promise.resolve();
    KOL.forEach(function (c) {
      p = p.then(function () { return root.collection(c).get(); }).then(function (s) {
        var ids = s.docs.map(function (d) { return d.id; }), q = Promise.resolve();
        for (var i = 0; i < ids.length; i += 400) {
          (function (potong) {
            q = q.then(function () {
              var bt = fdb.batch();
              potong.forEach(function (id) { bt.delete(root.collection(c).doc(id)); });
              return bt.commit().then(function () { n += potong.length; });
            });
          })(ids.slice(i, i + 400));
        }
        return q;
      });
    });
    p.then(function () { return root.collection('akses').doc('roles').delete(); }).then(function () { return root.delete(); }).then(function () {
      lupakanRoom(kode);
      dhKode = ''; dvBuka = ''; delete dvInfo[kode];
      if (lsGet('kk-room-aktif') === kode) { lsSet('kk-room-aktif', ''); muatUlang(); return; }
      DVLIST = (DVLIST || []).filter(function (r) { return r.kode !== kode; });
      tampilSemuaRoom(); muatAudit();
      note('Room ' + kode + ' dihapus (' + n + ' dokumen).');
    }).catch(function () {
      var el = $('#dhm'); if (el) { el.className = 'err'; el.textContent = 'Gagal menghapus sebagian. Cek aturan Firestore versi terbaru, lalu coba lagi.'; }
    });
  }

  /** Daftar iuran di sub-halaman Iuran; dibangun ulang tanpa menyentuh kolom isian. */
  function updIuran() {
    var box = $('#nkList');
    if (!box) return;
    var naik = (CFG.naik || []).slice().sort(function (a, c) { return a.dari < c.dari ? -1 : 1; });
    box.innerHTML = '<div class="kv"><span>Kas awal</span><b class="mono">' + rp(CFG.base || 10000) + '</b></div>' +
      naik.map(function (x) {
        return '<div class="kv"><span>Mulai ' + bln(x.dari) + '</span><span class="acts"><b class="mono">' + rp(x.nominal) + '</b>' +
          '<button class="btn ghost sm2 del" type="button" data-a="dn" data-id="' + esc(x.dari) + '">' + (armed === 'dn' + x.dari ? 'Yakin?' : 'Hapus') + '</button></span></div>';
      }).join('') +
      '<p class="sm">' + (MINGGU() ? 'Minggu' : 'Bulan') + ' ini: ' + rp(nominal(cur())) + ' per ' + SATUAN() + '.</p>';
  }

  /* =========================================================
   * Login bendahara
   * ========================================================= */
  function bukaLogin() { $('#lgn').hidden = false; $('#lgE').focus(); }
  function tutupLogin() { $('#lgn').hidden = true; $('#lgS').value = ''; $('#lgErr').textContent = ''; }

  $('#role').onclick = function () { openSet('akun'); };
  $('#gear').onclick = function () { openSet(''); };
  $('#lgBatal').onclick = tutupLogin;

  $('#lgF').onsubmit = function (ev) {
    ev.preventDefault();
    if (!auth) return;
    var btn = $('#lgBtn'), er = $('#lgErr');
    er.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Memproses…';

    auth.signInWithEmailAndPassword($('#lgE').value.trim(), $('#lgS').value)
      .then(tutupLogin)
      .catch(function (x) {
        er.textContent =
          x.code === 'auth/network-request-failed' ? 'Tidak ada koneksi internet.' :
          x.code === 'auth/too-many-requests' ? 'Terlalu banyak percobaan. Coba lagi nanti.' :
          'Email atau kata sandi salah.';
      })
      .then(function () { btn.disabled = false; btn.textContent = 'Masuk'; });
  };

  $('#lgDaftar').onclick = function () {
    var er = $('#lgErr'), email = $('#lgE').value.trim(), pw = $('#lgS').value;
    if (!auth) return;
    if (!email || pw.length < 6) { er.textContent = 'Isi email dan kata sandi (minimal 6 karakter), lalu ketuk Daftar.'; return; }
    er.textContent = 'Mendaftar…';
    auth.createUserWithEmailAndPassword(email, pw).then(tutupLogin).catch(function (x) {
      er.textContent =
        x.code === 'auth/email-already-in-use' ? 'Email itu sudah terdaftar. Ketuk Masuk.' :
        x.code === 'auth/weak-password' ? 'Kata sandi terlalu lemah (minimal 6 karakter).' :
        x.code === 'auth/invalid-email' ? 'Format email salah.' :
        x.code === 'auth/network-request-failed' ? 'Tidak ada koneksi internet.' : 'Gagal mendaftar.';
    });
  };

  $('#lgLupa').onclick = function () {
    var email = $('#lgE').value.trim(), er = $('#lgErr');
    if (!auth) return;
    if (!email) { er.textContent = 'Isi email dulu, lalu ketuk Lupa kata sandi.'; return; }
    auth.sendPasswordResetEmail(email)
      .then(function () { er.textContent = 'Jika email terdaftar, tautan reset sudah dikirim.'; })
      .catch(function () { er.textContent = 'Gagal mengirim. Cek email dan koneksi.'; });
  };

  /* =========================================================
   * Mulai
   * ========================================================= */
  function tandaiMuat() {
    if (++loaded === TOTAL_SUMBER) {
      clearTimeout(loadTimer);
      note('');
      show();
    }
  }

  /** Tampilkan peringatan bila data yang terlihat masih dari simpanan HP dan server belum terjangkau. */
  function cekStale() {
    var dariHP = Object.keys(dariCache).some(function (k) { return dariCache[k]; });
    if (!dariHP) { clearTimeout(staleTimer); staleTimer = null; $('#stale').hidden = true; return; }
    if ($('#stale').hidden && !staleTimer) staleTimer = setTimeout(function () { staleTimer = null; $('#stale').hidden = false; }, 4000);
  }

  /** Langganan realtime satu koleksi. */
  function langganan(koleksi, simpanData, query) {
    var pertama = true;
    (query || db.collection(koleksi)).onSnapshot({ includeMetadataChanges: true }, function (s) {
      dariCache[koleksi] = !!s.metadata.fromCache;
      cekStale();
      var ambil = function () { simpanData(s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })); };
      if (pertama) { pertama = false; ambil(); tandaiMuat(); return; }
      if (!s.docChanges().length) return;   // hanya status sinkron yang berubah
      ambil();
      fill();
    }, function () {
      note('Data belum bisa dimuat.', 'red');
    });
  }

  function init() {
    applyTema();
    lensGeser('#nav'); lensGeser('#modebar');
    applyUkuran();
    renderNav();
    $('#view').innerHTML = '<p class="sm">Memuat…</p>';

    var dariUrl = '';
    try { dariUrl = normKode(new URLSearchParams(location.search).get('r')); } catch (e) {}
    KODE = kodeSah(dariUrl) ? dariUrl : normKode(lsGet('kk-room-aktif'));
    if (!kodeSah(KODE)) KODE = '';
    if (KODE && dariUrl === KODE) lsSet('kk-room-aktif', KODE);

    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      fdb = firebase.firestore();
      auth = firebase.auth();
      fdb.enablePersistence({ synchronizeTabs: true }).catch(function () {});   // data tetap terbaca saat sinyal buruk
    } catch (e) {
      fdb = null;
    }

    if (!fdb) {
      $('#role').textContent = 'Hanya lihat';
      $('#view').innerHTML = '<div class="alert red">Koneksi ke server gagal. Cek internet lalu muat ulang.</div>';
      return;
    }

    db = KODE ? ruang(KODE) : null;
    var rn = daftarRoom().filter(function (r) { return r.kode === KODE; })[0];
    if (rn) { RNAMA = rn.nama; $('#ttl').textContent = RNAMA; }

    auth.onAuthStateChanged(function (u) {
      if (unsubRoles) { unsubRoles(); unsubRoles = null; }
      ROLES = {};
      if (u && db) {
        unsubRoles = db.doc('akses/roles').onSnapshot(function (s) {
          ROLES = s.exists ? s.data() : {};
          terapkanPeran();
        }, function () { ROLES = {}; terapkanPeran(); });
      }
      terapkanPeran();
    });

    if (!KODE) { tab = 'set'; sub = 'room'; show(); return; }

    fdb.collection('groups').doc(KODE).onSnapshot(function (s) {
      if (s.exists) {
        RNAMA = s.data().nama || KODE;
        $('#ttl').textContent = RNAMA;
        simpanRoom(KODE, RNAMA);
      } else if (!s.metadata.fromCache) {
        pesanRoom = 'Room ' + KODE + ' tidak ditemukan. Periksa kodenya.';
        lupakanRoom(KODE); lsSet('kk-room-aktif', '');
        KODE = ''; db = null; RNAMA = ''; $('#ttl').textContent = 'Kaskita';
        openSet('room');
      }
    }, function () {});

    loadTimer = setTimeout(function () {
      note('Data belum terjangkau, mungkin belum yang terbaru.');
    }, 10000);

    langganan('members', function (a) { M = a; });
    langganan('pay', function (a) { P = a; });
    langganan('exp', function (a) { X = a; });
    langganan('log', function (a) { LOG = a; }, db.collection('log').orderBy('ts', 'desc').limit(100));

    var cfgPertama = true;
    db.doc('cfg/main').onSnapshot(function (s) {
      if (s.exists) CFG = s.data();
      if (cfgPertama) { cfgPertama = false; tandaiMuat(); } else { fill(); }
    }, function () {
      if (cfgPertama) { cfgPertama = false; tandaiMuat(); }
    });
    var fiturPertama = true;
    db.doc('cfg/fitur').onSnapshot(function (s) {
      FITUR = s.exists ? s.data() : null;
      if (fiturPertama) { fiturPertama = false; tandaiMuat(); return; }
      if (tab === 'set') { if (!sub) fSet(); } else { iSel = ''; show(); }
    }, function () {
      if (fiturPertama) { fiturPertama = false; tandaiMuat(); }
    });
    ['iur', 'ipay', 'iexp'].forEach(function (c) {
      var pertama = true, simpanData = function (a) { if (c === 'iur') IUR = a; else if (c === 'ipay') IP = a; else IX = a; };
      db.collection(c).onSnapshot(function (sn) {
        var ambil = function () { simpanData(sn.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })); };
        if (pertama) { pertama = false; ambil(); IBMUAT[c] = true; fill(); return; }
        if (!sn.docChanges().length) return;
        ambil();
        if (mode() === 'iuran' || tab === 'anggota') fill();
      }, function () { IBMUAT[c] = true; if (mode() === 'iuran') fill(); });   // aturan lama belum mengenal koleksi ini: tampil kosong
    });
    db.doc('cfg/bayar').onSnapshot(function (s) {
      BAYAR = s.exists ? s.data() : null;
      if (!cfgPertama) { if (tab === 'set' && sub === 'bayar') fSet(); else fill(); }
    }, function () {});
  }

  init();

  /* Service worker (agar bisa dipasang sebagai PWA/APK) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
/* ===== Pemilih (pengganti daftar pilihan bawaan HP): lembar bawah bertema ===== */
(function () {
  var sheet = null, aktifSel = null, tombolAsal = null;
  function teks(o) { return o ? (o.getAttribute('data-lbl') || o.text) : ''; }
  function sinkron(sel) {
    var b = sel._btn; if (!b) return;
    var o = sel.options[sel.selectedIndex], t = teks(o);
    b.firstChild.textContent = t || '';
    b.classList.toggle('kosong', !sel.value);
  }
  function pasang(sel) {
    if (sel.getAttribute('data-e')) return;
    sel.setAttribute('data-e', '1'); sel.tabIndex = -1;
    var w = document.createElement('div'); w.className = 'selw';
    sel.parentNode.insertBefore(w, sel); w.appendChild(sel);
    var b = document.createElement('button'); b.type = 'button'; b.className = 'selbtn';
    b.innerHTML = '<span></span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    b.addEventListener('click', function () { buka(sel, b); });
    w.appendChild(b); sel._btn = b; sinkron(sel);
    new MutationObserver(function () { sinkron(sel); }).observe(sel, { childList: true });
  }
  function semua() { Array.prototype.forEach.call(document.querySelectorAll('select:not([data-e])'), pasang); }

  function bangun() {
    sheet = document.createElement('div'); sheet.id = 'sht'; sheet.hidden = true;
    sheet.innerHTML = '<div class="shp" role="dialog" aria-modal="true"><div class="shh"><b></b><button type="button" class="lnk" data-x>Tutup</button></div><input class="shq" type="search" placeholder="Cari…" autocomplete="off"><div class="shl" role="listbox"></div></div>';
    sheet.addEventListener('click', function (e) { if (e.target === sheet || e.target.hasAttribute('data-x')) tutup(); });
    sheet.querySelector('.shq').addEventListener('input', function () { isi(this.value); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) tutup(); });
    document.body.appendChild(sheet);
  }
  function isi(q) {
    var l = sheet.querySelector('.shl'); l.innerHTML = '';
    q = (q || '').toLowerCase();
    var n = 0;
    Array.prototype.forEach.call(aktifSel.options, function (o) {
      if (o.value === '' && aktifSel.required) return;   // placeholder tidak ditampilkan sebagai pilihan
      var t = o.text + ' ' + (o.getAttribute('data-sub') || '');
      if (q && t.toLowerCase().indexOf(q) < 0) return;
      n++;
      var b = document.createElement('button'); b.type = 'button'; b.className = 'sho';
      b.setAttribute('role', 'option'); b.setAttribute('aria-selected', String(o.value === aktifSel.value));
      var kiri = document.createElement('span'), nm = document.createElement('span');
      nm.textContent = o.getAttribute('data-lbl') || o.text; kiri.appendChild(nm);
      var sub = o.getAttribute('data-sub');
      if (sub) { var s = document.createElement('small'); s.textContent = sub; kiri.appendChild(s); }
      b.appendChild(kiri);
      var tag = o.getAttribute('data-tag');
      if (tag) { var g = document.createElement('span'); g.className = 'st' + (/^lunas/i.test(tag) ? ' ok' : ''); g.textContent = tag; b.appendChild(g); }
      b.addEventListener('click', function () {
        aktifSel.value = o.value;
        aktifSel.dispatchEvent(new Event('input', { bubbles: true }));
        aktifSel.dispatchEvent(new Event('change', { bubbles: true }));
        sinkron(aktifSel); tutup();
      });
      l.appendChild(b);
    });
    if (!n) { var k = document.createElement('p'); k.className = 'sm'; k.style.padding = '12px'; k.textContent = 'Tidak ada yang cocok.'; l.appendChild(k); }
  }
  function buka(sel, btn) {
    if (!sheet) bangun();
    aktifSel = sel; tombolAsal = btn;
    var judul = sel.getAttribute('aria-label') || sel.getAttribute('data-judul') || (sel.options[0] && sel.options[0].value === '' ? sel.options[0].text : 'Pilih');
    sheet.querySelector('b').textContent = judul;
    var q = sheet.querySelector('.shq'); q.value = ''; q.hidden = sel.options.length < 9;
    isi('');
    sheet.hidden = false; document.documentElement.style.overflow = 'hidden';
    var cur = sheet.querySelector('[aria-selected="true"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
  }
  function tutup() {
    sheet.hidden = true; document.documentElement.style.overflow = '';
    if (tombolAsal) tombolAsal.focus();
  }
  new MutationObserver(semua).observe(document.body, { childList: true, subtree: true });
  setInterval(function () { Array.prototype.forEach.call(document.querySelectorAll('select[data-e]'), sinkron); }, 500);
  semua();
})();
</script>
