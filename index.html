<style>
/* ===== Tema ===== */
:root {
  color-scheme: light;
  --bg-img: none;
  --bg: #F2F4F1;  --surface: #fff;  --field: #F6F8F5;
  --ink: #16231F; --muted: #5E6B66; --line: #DCE2DD;
  --accent: #1F4E79; --accent-ink: #fff;
  --in: #18794E;  --in-soft: #E1F1E8;
  --out: #B23A2B; --out-soft: #F8E6E2;
  --warn: #8A6100; --warn-soft: #FBF0D0;
  --fd: "Familjen Grotesk", system-ui, sans-serif;
  --fb: "IBM Plex Sans", system-ui, sans-serif;
  --fm: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --bg: #0F1613;  --surface: #18221E;  --field: #121B17;
    --ink: #E7EEEA; --muted: #93A39B; --line: #2A3832;
    --accent: #7FB0E0; --accent-ink: #0F1613;
    --in: #5CC58D;  --in-soft: #173126;
    --out: #F0897A; --out-soft: #3A1D19;
    --warn: #E6C265; --warn-soft: #3A311A;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1613;  --surface: #18221E;  --field: #121B17;
  --ink: #E7EEEA; --muted: #93A39B; --line: #2A3832;
  --accent: #7FB0E0; --accent-ink: #0F1613;
  --in: #5CC58D;  --in-soft: #173126;
  --out: #F0897A; --out-soft: #3A1D19;
  --warn: #E6C265; --warn-soft: #3A311A;
}
:root[data-theme="hitam"] {
  color-scheme: dark;
  --bg: #000000; --surface: #111413; --field: #0A0C0B; --ink: #ECECEC; --muted: #9A9F9C;
  --line: #262A28; --accent: #7FB0E0; --accent-ink: #000000; --in: #5CC58D; --in-soft: #0F2A1D;
  --out: #F0897A; --out-soft: #2E1612; --warn: #E6C265; --warn-soft: #2A2410;
}
:root[data-theme="biru"] {
  color-scheme: dark;
  --bg: #1B2740; --bg-img: linear-gradient(180deg, #222F4C 0%, #1B2740 100%);
  --surface: #26344F; --field: #202C45; --ink: #E8EDF5; --muted: #A3B0C6;
  --line: #36466A; --accent: #9DB8E0; --accent-ink: #1B2740; --in: #7FCFA6; --in-soft: #1F3D3F;
  --out: #F0A596; --out-soft: #4A2F3E; --warn: #F0D58E; --warn-soft: #4A4030;
}
:root[data-theme="mawar"] {
  color-scheme: light;
  --bg: #F3E4E1; --bg-img: linear-gradient(180deg, #F6E7E3 0%, #EBD5D2 100%);
  --surface: #FBF3F1; --field: #F5E8E5; --ink: #2E1D1D; --muted: #6B5453;
  --line: #E2CBC8; --accent: #8C2F39; --accent-ink: #FFFFFF; --in: #176B42; --in-soft: #DDEEDF;
  --out: #A8322A; --out-soft: #F6DAD5; --warn: #7A5200; --warn-soft: #F7E8C3;
}
:root[data-theme="eukaliptus"] {
  color-scheme: light;
  --bg: #EBF0EC; --surface: #F9FBF9; --field: #F0F4F1; --ink: #1B2620; --muted: #5D6E64;
  --line: #D7E2D9; --accent: #2C3E35; --accent-ink: #FFFFFF; --in: #1F6B4A; --in-soft: #DDEEE3;
  --out: #A8402A; --out-soft: #FBECE8; --warn: #7A5200; --warn-soft: #F7EBC9;
}
:root[data-theme="nordik"] {
  color-scheme: light;
  --bg: #EDF1F4; --surface: #FFFFFF; --field: #F3F6F8; --ink: #16212C; --muted: #5E6E7E;
  --line: #DCE3E8; --accent: #1E4E5F; --accent-ink: #FFFFFF; --in: #1A6B50; --in-soft: #E0F1EA;
  --out: #A8402A; --out-soft: #FCEAE6; --warn: #7A5200; --warn-soft: #F7EBC9;
}
:root[data-theme="kaca"] {
  color-scheme: dark;
  --bg: #070A12; --bg-img: radial-gradient(120% 55% at 85% 105%, #0C2F73 0%, transparent 65%), linear-gradient(180deg, #0B1020 0%, #070A12 100%);
  --surface: rgba(34, 48, 82, .55); --field: rgba(8, 12, 24, .55); --ink: #E9EEFB; --muted: #A4B1CE;
  --line: rgba(150, 175, 230, .24); --accent: #6FA8FF; --accent-ink: #06101F; --in: #6FE0A6; --in-soft: rgba(60, 190, 130, .16);
  --out: #FF9D8E; --out-soft: rgba(255, 110, 90, .16); --warn: #F0D58E; --warn-soft: rgba(240, 213, 142, .15);
}
:root[data-theme="kaca"] .card, :root[data-theme="kaca"] nav, :root[data-theme="kaca"] .smenu {
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
}

/* ===== Dasar ===== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--bg); background-image: var(--bg-img); background-attachment: fixed;
  color: var(--ink);
  font: .9375rem/1.5 var(--fb);
  padding: calc(20px + env(safe-area-inset-top, 0px))
           max(14px, env(safe-area-inset-right, 0px))
           calc(40px + env(safe-area-inset-bottom, 0px))
           max(14px, env(safe-area-inset-left, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
h1 { font: 700 1.6rem/1.2 var(--fd); margin: 0; }
h2 { font: 600 1.05rem/1.3 var(--fd); margin: 0; }

.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.dvc { padding: 0; gap: 0; overflow: hidden; margin-top: 8px; }
.dvr { display: flex; align-items: stretch; }
.dvmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 14px; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.dvmain svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.dvmain b { display: block; font-weight: 600; }
.dvmain small { display: block; color: var(--muted); font-size: .85rem; }
.dvdot { width: 52px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.dvdot[aria-expanded="true"] { color: var(--accent); }
.dvp { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.badge.dev { border-color: var(--accent); color: var(--accent); }
.badge {
  font-size: .78rem; font-weight: 600; color: var(--muted);
  background: none; border: 1px solid var(--line); border-radius: 99px;
  padding: 2px 10px; cursor: pointer;
}

/* ===== Navigasi ===== */
nav {
  display: grid; gap: 4px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
nav button {
  height: 36px; border: 0; border-radius: 7px; background: none;
  color: var(--muted); font-weight: 600; font-size: .88rem; cursor: pointer;
}
nav button[aria-pressed=true] { background: var(--ink); color: var(--bg); }

/* ===== Komponen ===== */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.lab { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font: 700 clamp(2rem, 8vw, 2.8rem)/1.1 var(--fd); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--fm); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid > div { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
.sm { font-size: .85rem; color: var(--muted); margin: 0; }
.in { color: var(--in); }
.out { color: var(--out); }
.err { color: var(--out); font-size: .88rem; margin: 0; }
.ok  { color: var(--in);  font-size: .88rem; margin: 0; }

.alert { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: .9rem; font-weight: 500; }
.alert.red { background: var(--out-soft); color: var(--out); }
.alert.green { background: var(--in-soft); color: var(--in); }

input, select, textarea {
  width: 100%; min-height: 42px; padding: 8px 12px;
  background: var(--field); border: 1px solid var(--line); border-radius: 8px;
}
textarea { min-height: 110px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 9rem; }

.btn {
  min-height: 42px; padding: 0 16px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 600; cursor: pointer; flex: 0 0 auto; width: auto;
}
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
.btn.sm2 { min-height: 34px; padding: 0 12px; font-size: .85rem; }
.btn.del { color: var(--out); }
.btn:disabled { opacity: .6; cursor: default; }

/* ===== Daftar anggota ===== */
.m { border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.m:first-child { border-top: 0; }
.m b { display: block; }
.m small { color: var(--muted); font-family: var(--fm); }
.chip { font-size: .78rem; font-weight: 600; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.lunas  { background: var(--in-soft);   color: var(--in); }
.kurang { background: var(--warn-soft); color: var(--warn); }
.belum  { background: var(--out-soft);  color: var(--out); }
.off    { background: var(--field);     color: var(--muted); }
.det { background: var(--field); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

/* ===== Tabel & baris riwayat ===== */
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { padding: 6px 4px; text-align: right; border-top: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-size: .72rem; color: var(--muted); text-transform: uppercase; border-top: 0; }
.pv { font-size: .85rem; border-top: 1px solid var(--line); padding: 4px 0; display: flex; gap: 8px; align-items: center; }
.pv > :nth-last-child(1):not(:first-child) { margin-left: auto; }
.hv { flex-wrap: wrap; }
.acts { display: flex; gap: 6px; }
.ed { border-top: 1px solid var(--line); padding: 8px 0; display: flex; flex-direction: column; gap: 8px; }

/* ===== Pengaturan, progres, tema ===== */
.hb { display: flex; gap: 6px; align-items: center; }
.shead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.shead .lnk { align-self: auto; }
.smenu { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.smenu button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.smenu button:last-child { border-bottom: 0; }
.smenu svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.smenu b { display: block; font-weight: 600; }
.smenu small { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; overflow-wrap: anywhere; }
.track { height: 8px; border-radius: 4px; background: var(--field); border: 1px solid var(--line); overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--in); border-radius: 4px; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.themes button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: .85rem; font-weight: 600; cursor: pointer; }
.themes button[aria-pressed="true"], .sizes button[aria-pressed="true"] { border-color: var(--accent); }
.themes .sw { display: block; width: 100%; height: 34px; border-radius: 8px; border: 1px solid rgba(128, 128, 128, .45); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chips button { min-height: 36px; padding: 0 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: .85rem; font-weight: 600; cursor: pointer; }
.chips button[aria-pressed="true"] { border-color: var(--accent); }
.sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sizes button { min-height: 40px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; }
.kv { display: flex; justify-content: space-between; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; font-size: .9rem; }

/* ===== Layar login ===== */
#lgn { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lgc { width: 100%; max-width: 400px; gap: 12px; padding: 22px; }
.lgc .btn { width: 100%; }
.lnk { background: none; border: 0; color: var(--accent); text-decoration: underline; font-size: .88rem; cursor: pointer; align-self: center; padding: 6px; }
</style>

  function rentangBulan(a, b) {
    if (a.length > 7) { var w = [], d = a; while (d <= b) { w.push(d); d = tambahHari(d, 7); } return w; }
    var r = [], p = a.split('-').map(Number), e = b.split('-').map(Number);
    var y = p[0], m = p[1];
    while (y < e[0] || (y === e[0] && m <= e[1])) {
      r.push(y + '-' + pad2(m));
      if (++m > 12) { m = 1; y++; }
    }
    return r;
  }

  /** Format input rupiah: 1500000 -> 1.500.000 */
  function maskRupiah(el) {
    el.addEventListener('input', function () {
      var d = el.value.replace(/\D/g, '').slice(0, 12);
      el.value = d ? Number(d).toLocaleString('id-ID') : '';
    });

  function note(msg, cls) {

  /** Tunggu hasil tulis ke Firestore: true bila berhasil, false (dengan pemberitahuan) bila ditolak. */
  function tulis(promise) {
    tertunda++;
    var tmr = setTimeout(function () { if (tertunda > 0) note('Menyimpan… menunggu koneksi. Jangan tutup aplikasi dulu.'); }, 2500);
    return promise.then(function () { return true; }, function () {
      note('Gagal menyimpan. Cek koneksi atau izin akun.', 'red');
      return false;
    }).then(function (ok) {
      clearTimeout(tmr);

  /** Kelompok riwayat: batal (hapus), anggota, pengurus, atau keuangan. */
  function kategori(aksi) {
    var a = String(aksi || '').toLowerCase();
    if (/^(hapus|batalkan)/.test(a)) return 'batal';
    if (/pengurus|host|room/.test(a)) return 'pengurus';
    if (/anggota|impor/.test(a)) return 'anggota';
    return 'keuangan';

  /** Satu perubahan = data + catatan riwayatnya, disimpan bersama atau tidak sama sekali. */
  function simpan(isi, aksi, ket) {
    var b = db.batch();
    isi(b);
    b.set(db.collection('log').doc(), { ts: Date.now(), aksi: aksi, ket: (isDev ? '[Dev] ' : '') + ket, kat: kategori(aksi) });
    if (isDev) audit(KODE, RNAMA, aksi, ket, b);
    return tulis(b.commit());

  /* =========================================================
   * Room (banyak kelompok dalam satu aplikasi)
   * ========================================================= */
  function normKode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function kodeSah(s) { return /^[A-Z0-9]{6,8}$/.test(s); }
  function daftarRoom() {
    try {
      var a = JSON.parse(lsGet('kk-rooms') || '[]');
      return Array.isArray(a) ? a.filter(function (r) { return r && kodeSah(r.kode); }) : [];
    } catch (e) { return []; }
  }
  function simpanRoom(kode, nama) {
    var a = daftarRoom().filter(function (r) { return r.kode !== kode; });
    a.unshift({ kode: kode, nama: nama || kode });
    lsSet('kk-rooms', JSON.stringify(a.slice(0, 12)));
  }
  function lupakanRoom(kode) {
    lsSet('kk-rooms', JSON.stringify(daftarRoom().filter(function (r) { return r.kode !== kode; })));
  }
  function muatUlang() { if (location.search) location.replace(location.pathname); else location.reload(); }
  function pilihRoom(kode, nama) { simpanRoom(kode, nama); lsSet('kk-room-aktif', kode); muatUlang(); }

  /** Pintasan ke data satu room: groups/{kode}/... */
  function ruang(kode) {
    var root = fdb.collection('groups').doc(kode);
    return {
      collection: function (c) { return root.collection(c); },
      doc: function (p) { var a = p.split('/'); return root.collection(a[0]).doc(a[1]); },
      batch: function () { return fdb.batch(); }
    };
  }

  function buatKode() {
    var a = new Uint8Array(6);
    crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (v) { return ALFABET.charAt(v % 32); }).join('');
  }
  function kodeBebas(sisa) {
    var k = buatKode();
    return fdb.collection('groups').doc(k).get().then(function (s) {
      if (!s.exists) return k;
      if (sisa <= 1) throw new Error('kode');
      return kodeBebas(sisa - 1);
    });
  }

      nr[uid] = 'host';

  /* =========================================================
   * Perhitungan iuran
   * ========================================================= */

  /** Nominal iuran yang berlaku pada bulan b ('YYYY-MM'). */
  function nominal(b) {
    var n = CFG.base || 10000;
    (CFG.naik || []).slice()
      .sort(function (a, c) { return a.dari < c.dari ? -1 : 1; })
      .forEach(function (x) { if (x.dari <= b) n = x.nominal; });
    return n;
  }

  /** Hitung tagihan, pembayaran, kurang/lebih, dan status satu anggota. */
  function hitung(m) {
    var skrg = cur();
    var akhir = (m.aktif === false && m.selesai && m.selesai < skrg) ? m.selesai : skrg;
    var bulan = (m.mulai && m.mulai <= akhir) ? rentangBulan(m.mulai, akhir) : [];

    var bayar = sum(P.filter(function (p) { return p.mid === m.id; }), jml)
              - sum(X.filter(function (x) { return x.mid === m.id && x.kind === 'kembali'; }), jml);

    var sisa = bayar;
    var rows = bulan.map(function (b) {
      var n = nominal(b);
      var terisi = Math.max(0, Math.min(sisa, n));
      sisa -= terisi;
      return { b: b, n: n, c: terisi };
    });

    var tagih = sum(rows, function (r) { return r.n; });
    var terakhir = rows[rows.length - 1];
    return {
      rows: rows,
      paid: bayar,
      tagih: tagih,
      kurang: Math.max(0, tagih - bayar),
      kredit: Math.max(0, bayar - tagih),
      st: tagih <= bayar ? 'lunas' : (terakhir && terakhir.c > 0 ? 'kurang' : 'belum')
    };
  }

  function derive() {
    D = M.map(function (m) { return Object.assign({}, m, hitung(m)); });
  }

  function fHome() {
    var aktif = D.filter(isAktif);
    var lain = sum(X.filter(function (x) { return x.kind === 'masuk'; }), jml);   // uang dari luar iuran (hadiah, donasi)
    var masuk = sum(P, jml) + lain;
    var keluar = sum(X.filter(function (x) { return x.kind !== 'masuk'; }), jml);
    // lebihan anggota nonaktif tidak punya bulan berikutnya, jadi menjadi milik kas
    var titipan = sum(D.filter(isAktif), function (m) { return m.kredit; });
    var saldo = masuk - keluar - titipan;
    var belum = aktif.filter(function (m) { return m.kurang > 0; });
    var tunggakan = sum(aktif, function (m) { return m.kurang; });

    // iuran periode berjalan: siapa yang tagihan bulan ini sudah terpenuhi
    var sk = cur();
    var ditagih = aktif.filter(function (m) { return m.rows.length && m.rows[m.rows.length - 1].b === sk; });
    var tTarget = sum(ditagih, function (m) { return m.rows[m.rows.length - 1].n; });
    var tTerisi = sum(ditagih, function (m) { return m.rows[m.rows.length - 1].c; });
    var tLunas = ditagih.filter(function (m) { var r = m.rows[m.rows.length - 1]; return r.c >= r.n; }).length;

    var pengeluaran = X.filter(function (x) { return x.kind !== 'kembali' && x.kind !== 'masuk'; })
      .sort(terbaru).slice(0, 5)
      .map(function (x) {
        return '<div class="pv"><span>' + esc(x.tgl) + '</span><span>' + esc(x.ket) + '</span>' +
               '<span class="mono out">' + rp(x.jumlah) + '</span></div>';
      }).join('');

    var bantu = !isDev ? '' : (!canEdit
      ? '<div class="alert">Mode bantuan: hanya lihat. <button class="btn sm2" type="button" data-a="dve">Aktifkan edit</button></div>'
      : (devEdit ? '<div class="alert red">Mode edit Dev aktif. Semua perubahan tercatat [Dev]. <button class="btn ghost sm2" type="button" data-a="dve">Kembali ke lihat saja</button></div>' : ''));
    $('#sum').innerHTML = bantu +
      '<div class="card">' +
        '<span class="lab">Saldo kas</span>' +
        '<span class="big mono ' + (saldo < 0 ? 'out' : '') + '">' + rp(saldo) + '</span>' +
        '<p class="sm">Uang di tangan bendahara: ' + rp(masuk - keluar) +
          (titipan > 0 ? ' &middot; titipan anggota: ' + rp(titipan) : '') + '</p>' +
        '<div class="grid">' +
          '<div><span class="lab in">Masuk</span><div class="mono">' + rp(masuk) + '</div>' +
            (lain > 0 ? '<span class="sm">termasuk ' + rp(lain) + ' pemasukan lain</span>' : '') + '</div>' +
          '<div><span class="lab out">Keluar</span><div class="mono">' + rp(keluar) + '</div></div>' +
        '</div>' +
      '</div>' +
      (belum.length
        ? '<div class="alert red">' + belum.length + ' anggota belum lunas &middot; total tunggakan ' + rp(tunggakan) + '. Lihat tab Anggota.</div>'
        : '<div class="alert green">Semua anggota aktif sudah lunas sampai ' + bln(cur()) + '.</div>') +
      '<div class="card"><h2>Iuran ' + bln(sk) + '</h2>' +
        (ditagih.length
          ? '<p class="sm"><b>' + tLunas + ' dari ' + ditagih.length + ' anggota</b> sudah lunas ' + SATUAN() + ' ini &middot; ' + rp(tTerisi) + ' dari ' + rp(tTarget) + '</p>' +
            '<div class="track"><i style="width:' + Math.min(100, tTarget ? Math.round(tTerisi / tTarget * 100) : 0) + '%"></i></div>'
          : '<p class="sm">Belum ada anggota yang ditagih ' + SATUAN() + ' ini.</p>') +
      '</div>' +
      (canEdit && belum.length
        ? '<div class="card"><h2>Pengingat tunggakan</h2>' +
            (pengingat
              ? '<textarea id="rt" readonly>' + esc(pengingat) + '</textarea>' +
                '<div class="row"><button class="btn ghost" type="button" data-a="rcp">Salin</button>' +
                '<a class="btn" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(pengingat) + '">Kirim lewat WhatsApp</a></div>'
              : '<button class="btn ghost" type="button" data-a="rem">Buat pesan pengingat</button>') +
          '</div>'
        : '') +
      '<div class="card"><h2>Pengeluaran terakhir</h2>' +
        (pengeluaran || '<p class="sm">Belum ada pengeluaran.</p>') +
      '</div>';
  }

  /* =========================================================
   * Tab: Anggota
   * ========================================================= */
  function chipStatus(m) {
    return m.aktif === false
      ? '<span class="chip off">nonaktif</span>'
      : '<span class="chip ' + m.st + '">' + m.st + '</span>';
  }

  function fAnggota() {
    var f = q.toLowerCase();
    var L = D.filter(function (m) {
      if (filt === 'belum' && !(isAktif(m) && m.kurang > 0)) return false;
      if (filt === 'lunas' && !(isAktif(m) && m.kurang === 0)) return false;
      if (filt === 'off' && isAktif(m)) return false;
      return !f || m.nama.toLowerCase().indexOf(f) > -1 || String(m.nim || '').indexOf(f) > -1;
    });
    L.sort(function (a, b) {
      if (sortBy === 'kurang') return (b.kurang - a.kurang) || byNama(a, b);
      return sortBy === 'nim'
        ? String(a.nim || '').localeCompare(String(b.nim || ''), 'id', { numeric: true })
        : byNama(a, b);
    });
    $('#cnt').textContent = L.length === D.length ? D.length + ' anggota' : L.length + ' dari ' + D.length + ' anggota';

    var html = L.map(function (m) {
      var row =
        '<div class="m" data-s="' + m.id + '">' +
          '<div><b>' + esc(m.nama) + '</b><small>' + esc(m.nim || 'tanpa NIM') + '</small></div>' +
          '<div style="text-align:right">' + chipStatus(m) +
            (m.kurang > 0 && isAktif(m) ? '<div class="sm mono">kurang ' + rp(m.kurang) + '</div>' : '') +
            (m.kredit > 0 ? '<div class="sm mono in">lebih ' + rp(m.kredit) + '</div>' : '') +
          '</div>' +
        '</div>';
      return sel === m.id ? row + detail(m) : row;
    }).join('');

    $('#list').innerHTML = html ||
      '<p class="sm">' + (M.length ? 'Tidak ada yang cocok.' : 'Belum ada anggota.' + (canEdit ? ' Ketuk Tambah atau impor anggota di bawah.' : '')) + '</p>';
  }

  function detail(m) {
    var bayar = P.filter(function (p) { return p.mid === m.id; }).sort(terbaru);

    var tabel = '<table><tr><th>' + (MINGGU() ? 'Minggu' : 'Bulan') + '</th><th>Tagihan</th><th>Terbayar</th></tr>' +
      m.rows.slice().reverse().map(function (r) {
        return '<tr><td>' + bln(r.b) + '</td><td class="mono">' + rp(r.n) + '</td>' +
               '<td class="mono ' + (r.c >= r.n ? 'in' : 'out') + '">' + rp(r.c) + '</td></tr>';
      }).join('') + '</table>';

    var info = '<p class="sm">Mulai ditagih: ' + (m.mulai ? bln(m.mulai) : '-') +
      (m.selesai ? ' &middot; berhenti: ' + bln(m.selesai) : '') + '</p>';

    var riwayat = bayar.map(function (p) {
      if (ed && ed.a === 'ep' && ed.id === p.id) return editForm({ id: p.id, t: 'in', ket: m.nama });
      return '<div class="pv hv"><span>' + esc(p.tgl) + '</span><span class="mono in">' + rp(p.jumlah) + '</span>' +
        (canEdit
          ? '<span class="acts"><button class="btn ghost sm2" data-a="ep" data-id="' + p.id + '">Ubah</button>' +
              '<button class="btn ghost sm2 del" data-a="dp" data-id="' + p.id + '">' +
              (armed === 'dp' + p.id ? 'Yakin?' : 'Hapus') + '</button></span>'
          : '') +
        '</div>';
    }).join('');
    var mn = memEd && memEd.id === m.id ? memEd : { nama: m.nama, nim: m.nim };

    var h = '<div class="det">' + tabel + info + riwayat;

    if (canEdit) {
      h += '<div class="row">' +
             '<input id="en" value="' + esc(mn.nama) + '">' +
             '<input id="ei" value="' + esc(mn.nim) + '" inputmode="numeric">' +
             '<button class="btn sm2" data-a="sv" data-id="' + m.id + '">Simpan</button>' +
           '</div><p id="emsg" class="err"></p>' +
           '<div class="row">' +
             '<button class="btn ghost sm2" data-a="tg" data-id="' + m.id + '">' +
               (m.aktif === false ? 'Aktifkan lagi' : 'Nonaktifkan') + '</button>' +
             (bayar.length
               ? ''
               : '<button class="btn ghost sm2 del" data-a="dm" data-id="' + m.id + '">' +
                   (armed === 'dm' + m.id ? 'Yakin hapus?' : 'Hapus anggota') + '</button>') +
           '</div>' +
           (m.aktif === false && m.kredit > 0
             ? '<p class="sm">Lebihan ' + rp(m.kredit) + ' masuk ke kas karena anggota ini nonaktif.</p>'
             : '');
    }
    return h + '</div>';
  }

  /** Semua aksi tombol & ketukan baris di dalam #view. */
  $('#view').addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g) { sub = g.dataset.go; PV = []; fSet(); window.scrollTo(0, 0); return; }

    var b = e.target.closest('button[data-a], button[data-t], button[data-u], button[data-lf]');

    if (!b) {
      var r = e.target.closest('[data-s]');
      if (r) { sel = (sel === r.dataset.s) ? null : r.dataset.s; memEd = null; ed = null; fAnggota(); }
      return;
    }

    var a = b.dataset.a, id = b.dataset.id;

    // aksi yang boleh dipakai siapa saja
    if (a === 'sback') {
      if (sub) { sub = ''; fSet(); } else { tab = prevTab; show(); }
      window.scrollTo(0, 0);
      return;
    }
    if (a === 'in') { bukaLogin(); return; }
    var th = b.dataset.t, uk = b.dataset.u;
    if (th) { lsSet('kk-tema', th); fSet(); return; }
    if (uk) { lsSet('kk-ukuran', uk); fSet(); return; }
    if (b.dataset.lf !== undefined) { lf = b.dataset.lf; fLaporan(); return; }

    if (a === 'out') { if (arm('out')) auth.signOut(); return; }
    if (a === 'ckd') { salin(KODE, b); return; }
    if (a === 'ctl') { salin(location.origin + location.pathname + '?r=' + KODE, b); return; }
    if (a === 'cuid') { salin(auth.currentUser.uid, b); return; }
    if (a === 'dve' && isDev) {
      devEdit = !devEdit;
      audit(KODE, RNAMA, devEdit ? 'Aktifkan edit' : 'Matikan edit', 'Mode edit Dev');
      terapkanPeran(); return;
    }
    if (a === 'dvm' && isDev) { bukaPanel(id); return; }
    if (a === 'dvb' && isDev) { unduhRoom(id); return; }
    if (a === 'dvr' && isDev) { pulihRoom(); return; }
    if (a === 'dh' && isDev) { dhKode = id; tampilSemuaRoom(); return; }
    if (a === 'dhx' && isDev) { dhKode = ''; tampilSemuaRoom(); return; }
    if (a === 'dh2' && isDev) {
      if (normKode($('#dk').value) !== id) { $('#dhm').className = 'err'; $('#dhm').textContent = 'Kode tidak cocok.'; return; }
      hapusRoom(id); return;
    }
    if (a === 'gr') { var rr = daftarRoom().filter(function (x) { return x.kode === id; })[0]; pilihRoom(id, (rr && rr.nama) || b.getAttribute('data-nm')); return; }
    if (a === 'jr') { masukRoom(); return; }
    if (a === 'br') { buatRoom(b); return; }
    if (a === 'kroom') {
      if (!arm('kroom')) return;
      lupakanRoom(KODE); lsSet('kk-room-aktif', ''); muatUlang();
      return;
    }

    if (!db || !canEdit) return;
    if (a === 'xj') { unduhCadangan(); return; }
    if (a === 'xc') { unduhRekap(); return; }
    if (a === 'sl' && isHost) { salinDataLama(b); return; }
    if (a === 'pad' && isHost) { tambahPengurus(); return; }
    if (a === 'prm' && isHost) { hapusPengurus(id); return; }
    if (a === 'thost' && isHost) { alihHost(id); return; }
    var m = D.find(function (x) { return x.id === id; });

    if (a === 'kel') { openSet('anggota'); return; }
    if (a === 'more') { histN += 20; fill(); return; }
    if (a === 'rem') { pengingat = teksPengingat(); fHome(); return; }
    if (a === 'rcp') {
      var area = $('#rt');
      if (area) area.select();
      try { navigator.clipboard.writeText(pengingat); } catch (er) { document.execCommand('copy'); }
      b.textContent = 'Tersalin';
      return;
    }
    if (a === 'aok') { tambahAnggota(); return; }
    if (a === 'ipr') { pratinjauImpor(); return; }
    if (a === 'iok') { jalankanImpor(); return; }
    if (a === 'iun') { batalkanImpor(); return; }
    if (a === 'cok') { ubahIuran(); return; }
    if (a === 'sb') { ubahBase(); return; }
    if (a === 'dn') { hapusNaik(id); return; }

    if (a === 'sv') {
      var nama = $('#en').value.trim().replace(/\s+/g, ' ');
      var nim = $('#ei').value.trim();
      if (!nama) { $('#emsg').textContent = 'Nama tidak boleh kosong.'; return; }
      if (nimDipakai(nim, id)) { $('#emsg').textContent = 'NIM itu sudah dipakai anggota lain.'; return; }
      memEd = null;
      simpan(function (bt) { bt.update(db.doc('members/' + id), { nama: nama, nim: nim }); },
        'Ubah anggota', m.nama + ' (NIM ' + (m.nim || '-') + ') menjadi ' + nama + ' (NIM ' + (nim || '-') + ')');
    }

    if (a === 'tg') {
      var aktifkan = (m.aktif === false);
      simpan(function (bt) { bt.update(db.doc('members/' + id), aktifkan ? { aktif: true, selesai: null } : { aktif: false, selesai: cur() }); },
        'Status anggota', m.nama + (aktifkan ? ' diaktifkan' : ' dinonaktifkan'));
    }

    if (a === 'dp') {
      if (!arm('dp' + id)) return;
      var p = P.find(function (x) { return x.id === id; });
      if (!p) return;
      var pm = M.find(function (x) { return x.id === p.mid; }) || {};
      simpan(function (bt) { bt.delete(db.doc('pay/' + id)); }, 'Hapus iuran', (pm.nama || '?') + ' ' + rp(p.jumlah) + ' tgl ' + p.tgl);
    }

    if (a === 'dx') {
      if (!arm('dx' + id)) return;
      var x = X.find(function (z) { return z.id === id; });
      if (!x) return;
      simpan(function (bt) { bt.delete(db.doc('exp/' + id)); }, x.kind === 'masuk' ? 'Hapus pemasukan lain' : 'Hapus catatan keluar', x.ket + ' ' + rp(x.jumlah));
    }

    if (a === 'ep' || a === 'ex') {
      var rec = (a === 'ep' ? P : X).find(function (r) { return r.id === id; });
      if (!rec) return;
      armed = '';
      ed = { a: a, id: id, tgl: rec.tgl || today(), jml: Number(rec.jumlah).toLocaleString('id-ID'), ket: rec.ket || '' };
      fill();
    }

    if (a === 'hb') { ed = null; fill(); }
    if (a === 'hs') simpanUbah(id);

    if (a === 'dm') {
      if (!arm('dm' + id)) return;
      sel = null;
      simpan(function (bt) { bt.delete(db.doc('members/' + id)); }, 'Hapus anggota', m.nama);
    }
  });

  /* =========================================================
   * Anggota: tambah, impor, iuran, pengingat
   * ========================================================= */
  function tambahAnggota() {
    var nama = $('#an').value.trim().replace(/\s+/g, ' ');
    var nim = $('#ai').value.trim();
    var mulai = kunci($('#am').value);
    var msg = $('#amsg');
    if (!nama || !mulai) { msg.className = 'err'; msg.textContent = 'Isi nama dan ' + (MINGGU() ? 'tanggal' : 'bulan') + ' mulai.'; return; }
    if (nimDipakai(nim)) { msg.className = 'err'; msg.textContent = 'NIM itu sudah dipakai.'; return; }
    msg.className = 'sm';
    msg.textContent = 'Menyimpan…';
    $('#an').value = $('#ai').value = '';
    simpan(function (b) { b.set(db.collection('members').doc(), { nama: nama, nim: nim, mulai: mulai, aktif: true, ts: Date.now() }); },
      'Tambah anggota', nama).then(function (ok) {
      msg.className = ok ? 'ok' : 'err';
      msg.textContent = ok ? nama + ' ditambahkan.' : 'Gagal menyimpan. Isi lagi dan coba ulang.';
    });
  }

  function ubahIuran() {
    var v = num($('#cn').value), m = kunci($('#cm').value);
    if (!v || !m) return;
    var naik = (CFG.naik || []).filter(function (x) { return x.dari !== m; });
    naik.push({ dari: m, nominal: v });
    $('#cn').value = '';
    simpan(function (b) { b.set(db.doc('cfg/main'), Object.assign({}, CFG, { naik: naik })); },
      'Ubah iuran', rp(v) + ' mulai ' + bln(m));
  }

  function ubahBase() {
    var v = num($('#cb').value);
    if (!v) return;
    $('#cb').value = '';
    simpan(function (b) { b.set(db.doc('cfg/main'), Object.assign({}, CFG, { base: v })); },
      'Ubah iuran awal', rp(CFG.base || 10000) + ' menjadi ' + rp(v));
  }

  function hapusNaik(dari) {
    if (!arm('dn' + dari)) return;
    var naik = (CFG.naik || []).filter(function (x) { return x.dari !== dari; });
    simpan(function (b) { b.set(db.doc('cfg/main'), Object.assign({}, CFG, { naik: naik })); },
      'Hapus kenaikan iuran', 'mulai ' + bln(dari));
  }

  function teksPengingat() {
    var belum = D.filter(function (m) { return isAktif(m) && m.kurang > 0; }).sort(byNama);
    return belum.length
      ? 'Pengingat kas (' + bln(cur()) + '). Yang belum lunas:\n' +
        belum.map(function (m, i) {
          return (i + 1) + '. ' + m.nama + (m.nim ? ' (' + m.nim + ')' : '') + ' - kurang ' + rp(m.kurang);
        }).join('\n') + '\nTerima kasih.'
      : 'Semua anggota sudah lunas.';
  }

  /* ----- Impor massal ----- */
  function parseImpor(teks) {
    return teks.split(/\r?\n/)
      .map(function (l) { return l.trim(); })
      .filter(Boolean)
      .map(function (l) {
        l = l.replace(/^\d{1,3}[.)]\s+/, '');                 // buang nomor urut
        var cocok = l.match(/\d{5,}/);
        var nim = cocok ? cocok[0] : '';
        var nama = l.replace(nim, '')
          .replace(/[\t,;|]+/g, ' ')
          .replace(/\s[-–]\s/g, ' ')
          .replace(/\s+/g, ' ').trim().toLowerCase()
          .replace(/(^|[\s-])\S/g, function (s) { return s.toUpperCase(); });
        return { nama: nama, nim: nim };
      });
  }

  function pratinjauImpor() {
    var seen = {};
    PV = parseImpor($('#ib').value).map(function (r) {
      var s = 'ok', w = '';
      if (r.nim && (nimDipakai(r.nim) || seen[r.nim])) { s = 'bad'; w = 'NIM kembar'; }
      else if (!r.nim || !r.nama) { s = 'warn'; w = !r.nim ? 'NIM kosong' : 'Nama kosong'; }
      else if (M.some(function (m) { return m.nama.toLowerCase() === r.nama.toLowerCase(); })) { s = 'warn'; w = 'Mungkin dobel'; }
      if (r.nim) seen[r.nim] = 1;
      r.s = s; r.w = w;
      return r;
    }).sort(byNama);

    var hitungStatus = function (s) { return PV.filter(function (r) { return r.s === s; }).length; };
    var kelas = { ok: 'lunas', warn: 'kurang', bad: 'belum' };
    var label = { ok: 'siap', warn: 'cek', bad: 'salah' };

    $('#ipv').innerHTML =
      '<p class="sm"><b>' + hitungStatus('ok') + ' siap, ' + hitungStatus('warn') + ' perlu dicek, ' +
      hitungStatus('bad') + ' bermasalah.</b> Baris bermasalah dilewati.</p>' +
      PV.map(function (r) {
        return '<div class="pv"><span class="chip ' + kelas[r.s] + '">' + label[r.s] + '</span>' +
               '<span>' + esc(r.nama || '(tanpa nama)') + '</span><span class="mono">' + esc(r.nim) + '</span>' +
               '<span class="sm">' + r.w + '</span></div>';
      }).join('');

    $('#iok').hidden = !PV.some(function (r) { return r.s !== 'bad' && r.nama; });
  }

  function jalankanImpor() {
    var batch = Date.now(), mulai = kunci($('#im').value);
    var ok = PV.filter(function (r) { return r.s !== 'bad' && r.nama; });
    var im = $('#imsg');
    if (!mulai || !ok.length) return;
    if (ok.length > 400) { im.textContent = 'Maksimal 400 anggota sekali impor. Bagi daftarnya.'; return; }
    $('#iok').hidden = true;
    im.textContent = 'Menyimpan…';
    simpan(function (b) {
      ok.forEach(function (r) {
        b.set(db.collection('members').doc(), { nama: r.nama, nim: r.nim, mulai: mulai, aktif: true, batch: batch, ts: batch });
      });
    }, 'Impor anggota', ok.length + ' anggota, mulai ditagih ' + bln(mulai)).then(function (berhasil) {
      var el = $('#imsg');
      if (!el) return;
      if (!berhasil) { el.textContent = 'Impor gagal, tidak ada anggota yang tersimpan. Daftar di atas masih ada.'; $('#iok').hidden = false; return; }
      el.textContent = ok.length + ' anggota diimpor. Daftar urut nama.';
      $('#ib').value = '';
      $('#ipv').innerHTML = '';
      PV = [];
    });
  }

  function batalkanImpor() {
    var batch = Math.max.apply(null, M.map(function (m) { return m.batch || 0; }));
    var im = $('#imsg');
    if (!batch) { im.textContent = 'Tidak ada impor yang bisa dibatalkan.'; return; }
    if (armed !== 'undo') im.textContent = 'Tekan sekali lagi untuk membatalkan impor terakhir.';
    if (!arm('undo')) return;

    var hapus = M.filter(function (m) { return m.batch === batch && !P.some(function (p) { return p.mid === m.id; }); });
    if (!hapus.length) { im.textContent = 'Semua anggota hasil impor terakhir sudah punya pembayaran, jadi dipertahankan.'; return; }
    simpan(function (b) { hapus.forEach(function (m) { b.delete(db.doc('members/' + m.id)); }); },
      'Batalkan impor', hapus.length + ' anggota dihapus').then(function (ok) {
      var el = $('#imsg');

  /** Simpan perubahan satu catatan (tanggal, jumlah, keperluan). Anggota tidak bisa diganti. */
  function simpanUbah(id) {
    if (!ed || ed.id !== id) return;
    var isPay = ed.a === 'ep';
    var rec = (isPay ? P : X).find(function (r) { return r.id === id; });
    if (!rec) { ed = null; fill(); return; }

    var t = $('#htg').value, j = num($('#hjm').value);
    var k = isPay ? '' : $('#hkt').value.trim().replace(/\s+/g, ' ');
    if (!t || !j || (!isPay && !k)) {
      $('#hmsg').textContent = isPay ? 'Isi tanggal dan jumlah.' : 'Isi keperluan, tanggal, dan jumlah.';
      return;
    }

    var ubah = [];
    if (t !== rec.tgl) ubah.push('tgl ' + rec.tgl + ' menjadi ' + t);
    if (j !== rec.jumlah) ubah.push(rp(rec.jumlah) + ' menjadi ' + rp(j));
    if (!isPay && k !== rec.ket) ubah.push('keperluan "' + rec.ket + '" menjadi "' + k + '"');

    ed = null;
    if (ubah.length) {
      if (isPay) {
        var pm = M.find(function (m) { return m.id === rec.mid; }) || {};
        simpan(function (bt) { bt.update(db.doc('pay/' + id), { tgl: t, jumlah: j }); }, 'Ubah iuran', (pm.nama || '?') + ': ' + ubah.join('; '));
      } else {
        simpan(function (bt) { bt.update(db.doc('exp/' + id), { tgl: t, ket: k, jumlah: j }); }, rec.kind === 'masuk' ? 'Ubah pemasukan lain' : 'Ubah catatan keluar', rec.ket + ': ' + ubah.join('; '));
      }
    }
    fill();
  }

  function tambahIuran(e) {
    e.preventDefault();
    var id = $('#pm').value, j = num($('#pj').value), t = $('#pt').value;
    var m = D.find(function (x) { return x.id === id; });
    var msg = $('#pmsg');

    if (!m || !j || !t) { msg.className = 'err'; msg.textContent = 'Lengkapi anggota, tanggal, dan jumlah.'; return; }

    var kunci = 'i|' + id + '|' + t + '|' + j;
    if (dup !== kunci && P.some(function (p) { return p.mid === id && p.tgl === t && p.jumlah === j; })) {

      msg.className = 'err';

      return;
    }
    dup = '';

    var lebih = Math.max(0, m.paid + j - m.tagih);
    var pesan = 'Tersimpan: ' + m.nama + ' ' + rp(j) + '.' +

    msg.textContent = 'Menyimpan…';
    $('#pj').value = '';

      msg.className = ok ? 'ok' : 'err';

  /** Khusus Dev: daftar semua room (aturan Firestore menolak siapa pun selain Dev). */
  var DVLIST = null, dhKode = '', dvBuka = '', dvInfo = {}, dvPulih = null;

  var KOL = ['members', 'pay', 'exp', 'log', 'cfg'];   // 'akses/roles' dibaca/dihapus sebagai dokumen (aturan tidak mengizinkan list)

  function lalu(ts) {
    if (!ts) return '-';

    if (!fdb) return;

  /** Baca seluruh isi satu room. */
  function muatInfo(kode) {
    var root = fdb.collection('groups').doc(kode);
    return Promise.all([root.get(), root.collection('akses').doc('roles').get()].concat(KOL.map(function (c) { return root.collection(c).get(); }))).then(function (h) {
      var o = { meta: h[0].exists ? h[0].data() : {} };
      o.akses = h[1].exists ? [{ id: 'roles', d: h[1].data() }] : [];
      KOL.forEach(function (c, i) { o[c] = h[i + 2].docs.map(function (d) { return { id: d.id, d: d.data() }; }); });
      return o;
    });
  }
  function ringkas(o) {
    var lain = sum(o.exp.filter(function (x) { return x.d.kind === 'masuk'; }), function (x) { return x.d.jumlah; });
    var masuk = sum(o.pay, function (x) { return x.d.jumlah; }) + lain;
    var keluar = sum(o.exp.filter(function (x) { return x.d.kind !== 'masuk'; }), function (x) { return x.d.jumlah; });
    var cfg = (o.cfg.filter(function (x) { return x.id === 'main'; })[0] || { d: {} }).d;
    var roles = (o.akses.filter(function (x) { return x.id === 'roles'; })[0] || { d: {} }).d, lb = roles.label || {};
    var peng = Object.keys(roles).filter(function (k) { return k !== 'label'; }).map(function (k) { return (lb[k] || 'Tanpa nama') + ' (' + (roles[k] === 'host' ? 'Host' : 'Bendahara') + ')'; });
    var logs = o.log.slice().sort(function (a, b) { return (b.d.ts || 0) - (a.d.ts || 0); });
    return {
      dibuat: o.meta.dibuat, minggu: cfg.periode === 'minggu', n: o.members.length,
      aktif: o.members.filter(function (x) { return x.d.aktif !== false; }).length,
      peng: peng, tangan: masuk - keluar, nPay: o.pay.length, nLog: o.log.length, terakhir: logs[0]
    };

  function panelRoom(r) {

    return '<div class="dvp">' + isi +

  function tampilSemuaRoom() {
    var box = $('#dvList'); if (!box || !DVLIST) return;
    box.innerHTML = DVLIST.length
      ? '<p class="sm">' + DVLIST.length + ' room. Ketuk &#8942; untuk detail, cadangan, atau hapus.</p>' + DVLIST.map(function (r) {

            '<button type="button" class="dvmain" data-a="gr" data-id="' + esc(r.kode) + '" data-nm="' + esc(r.nama) + '">' + IC.room + '<span><b>' + esc(r.nama) + '</b><small>' + esc(r.kode) + (r.kode === KODE ? ' &middot; sedang dibuka' : '') + '</small></span></button>' +
            '<button type="button" class="dvdot" data-a="dvm" data-id="' + esc(r.kode) + '" aria-label="Detail room" aria-expanded="' + buka + '">' + DOTS + '</button></div>' +

  }
  function muatSemuaRoom() {
    if (!isDev || !fdb) return;
    fdb.collection('groups').get().then(function (s) {
      DVLIST = s.docs.map(function (d) { return { kode: d.id, nama: (d.data() || {}).nama || d.id }; })
        .sort(function (x, y) { return x.nama.localeCompare(y.nama, 'id') || x.kode.localeCompare(y.kode); });

  function bukaPanel(kode) {

      muatInfo(kode).then(function (o) { dvInfo[kode] = { s: ringkas(o) }; }, function () { dvInfo[kode] = { err: 1 }; })
        .then(function () { if (dvBuka === kode) tampilSemuaRoom(); });

  function namaRoomDv(kode) { var r = (DVLIST || []).filter(function (x) { return x.kode === kode; })[0]; return r ? r.nama : kode; }

  /** Cadangan satu room ke file JSON. */
  function unduhRoom(kode) {
    note('Menyiapkan cadangan…');
    muatInfo(kode).then(function (o) {
      var one = function (c) { return (o[c.n] || []).filter(function (x) { return c.id ? x.id === c.id : true; }); };
      var isi = {
        versi: 3, kode: kode, nama: o.meta.nama || kode, pembuat: o.meta.pembuat || '', dibuat: o.meta.dibuat || 0, waktu: new Date().toISOString(),
        akses: (one({ n: 'akses', id: 'roles' })[0] || {}).d || null,
        cfg: (one({ n: 'cfg', id: 'main' })[0] || {}).d || null,
        members: o.members, pay: o.pay, exp: o.exp, log: o.log
      };
      unduh('kas-' + kode.toLowerCase() + '-cadangan-' + today() + '.json', JSON.stringify(isi, null, 1), 'application/json');
      audit(kode, o.meta.nama, 'Unduh cadangan', o.members.length + ' anggota, ' + o.pay.length + ' iuran');
      note('Cadangan ' + kode + ' diunduh.');
      muatAudit();
    }).catch(function () { note('Gagal membuat cadangan.', 'red'); });
  }

  /** Pulihkan room dari file cadangan. */
  function bacaCadangan() {
    var f = $('#dvf') && $('#dvf').files[0], pv = $('#dvPv');
    dvPulih = null;
    if (!f || !pv) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var d = JSON.parse(fr.result);
        if (d.versi !== 3 || !kodeSah(d.kode) || typeof d.nama !== 'string' || !Array.isArray(d.members)) throw new Error('x');
        dvPulih = d;
        var ada = (DVLIST || []).some(function (r) { return r.kode === d.kode; });
        pv.innerHTML = '<div class="det"><p class="sm"><b>' + esc(d.nama) + '</b> (' + esc(d.kode) + ')<br>' + d.members.length + ' anggota, ' + (d.pay || []).length + ' iuran, ' + (d.exp || []).length + ' catatan lain, ' + (d.log || []).length + ' riwayat.</p>' +
          (ada ? '<p class="err">Room ini masih ada. Data dengan id sama akan ditimpa, riwayat yang sudah ada tidak diubah.</p>' : '<p class="sm">Room ini akan dibuat kembali.</p>') +
          '<button class="btn" type="button" data-a="dvr">Pulihkan</button><p id="dvPm" class="sm"></p></div>';
      } catch (e) { pv.innerHTML = '<p class="err">File bukan cadangan room Kaskita yang sah.</p>'; }
    };

  function pulihRoom() {
    var d = dvPulih, pm = $('#dvPm');
    if (!d || !pm) return;
    var kode = d.kode, root = fdb.collection('groups').doc(kode);
    pm.className = 'sm'; pm.textContent = 'Memulihkan…';
    root.collection('log').get().then(function (ls) {
      var ada = {}; ls.docs.forEach(function (x) { ada[x.id] = 1; });
      var ops = [[root, { nama: d.nama, pembuat: d.pembuat, dibuat: d.dibuat }]];
      if (d.akses) ops.push([root.collection('akses').doc('roles'), d.akses]);
      if (d.cfg) ops.push([root.collection('cfg').doc('main'), d.cfg]);
      ['members', 'pay', 'exp'].forEach(function (c) { (d[c] || []).forEach(function (x) { ops.push([root.collection(c).doc(x.id), x.d]); }); });
      (d.log || []).forEach(function (x) { if (!ada[x.id]) ops.push([root.collection('log').doc(x.id), x.d]); });
      ops.push([fdb.collection('audit').doc(), { ts: Date.now(), kode: kode, nama: d.nama, aksi: 'Pulihkan room', ket: d.members.length + ' anggota' }]);
      var p = Promise.resolve();
      for (var i = 0; i < ops.length; i += 400) {
        (function (potong) {
          p = p.then(function () { var bt = fdb.batch(); potong.forEach(function (o) { bt.set(o[0], o[1]); }); return bt.commit(); });
        })(ops.slice(i, i + 400));
      }
      return p.then(function () { return ops.length; });
    }).then(function (n) {
      simpanRoom(kode, d.nama);
      if (!(DVLIST || []).some(function (r) { return r.kode === kode; })) { DVLIST = (DVLIST || []).concat([{ kode: kode, nama: d.nama }]); }

    }).catch(function () {

    });

  /** Hapus satu room beserta seluruh isinya (subkoleksi dulu, baru dokumen room). */
  function hapusRoom(kode) {
    var msg = $('#dhm'), root = fdb.collection('groups').doc(kode), nama = namaRoomDv(kode);
    msg.className = 'sm'; msg.textContent = 'Menghapus…';
    var n = 0;
    var p = audit(kode, nama, 'Hapus room', 'Room dihapus permanen') || Promise.resolve();
    KOL.forEach(function (c) {
      p = p.then(function () { return root.collection(c).get(); }).then(function (s) {
        var ids = s.docs.map(function (d) { return d.id; }), q = Promise.resolve();
        for (var i = 0; i < ids.length; i += 400) {
          (function (potong) {
            q = q.then(function () {
              var bt = fdb.batch();
              potong.forEach(function (id) { bt.delete(root.collection(c).doc(id)); });
              return bt.commit().then(function () { n += potong.length; });
            });
          })(ids.slice(i, i + 400));

        return q;
      });
    });
    p.then(function () { return root.collection('akses').doc('roles').delete(); }).then(function () { return root.delete(); }).then(function () {
      lupakanRoom(kode);
      dhKode = ''; dvBuka = ''; delete dvInfo[kode];
      if (lsGet('kk-room-aktif') === kode) { lsSet('kk-room-aktif', ''); muatUlang(); return; }
      DVLIST = (DVLIST || []).filter(function (r) { return r.kode !== kode; });
      tampilSemuaRoom(); muatAudit();
      note('Room ' + kode + ' dihapus (' + n + ' dokumen).');
    }).catch(function () {
      var el = $('#dhm'); if (el) { el.className = 'err'; el.textContent = 'Gagal menghapus sebagian. Cek aturan Firestore versi terbaru, lalu coba lagi.'; }
    });
  }

  /** Daftar iuran di sub-halaman Iuran; dibangun ulang tanpa menyentuh kolom isian. */
  function updIuran() {
    var box = $('#nkList');
    if (!box) return;
    var naik = (CFG.naik || []).slice().sort(function (a, c) { return a.dari < c.dari ? -1 : 1; });
    box.innerHTML = '<div class="kv"><span>Iuran awal</span><b class="mono">' + rp(CFG.base || 10000) + '</b></div>' +
      naik.map(function (x) {
        return '<div class="kv"><span>Mulai ' + bln(x.dari) + '</span><span class="acts"><b class="mono">' + rp(x.nominal) + '</b>' +
          '<button class="btn ghost sm2 del" type="button" data-a="dn" data-id="' + esc(x.dari) + '">' + (armed === 'dn' + x.dari ? 'Yakin?' : 'Hapus') + '</button></span></div>';
      }).join('') +
      '<p class="sm">' + (MINGGU() ? 'Minggu' : 'Bulan') + ' ini: ' + rp(nominal(cur())) + ' per ' + SATUAN() + '.</p>';
  }

  /* =========================================================
   * Login bendahara
   * ========================================================= */
  function bukaLogin() { $('#lgn').hidden = false; $('#lgE').focus(); }
  function tutupLogin() { $('#lgn').hidden = true; $('#lgS').value = ''; $('#lgErr').textContent = ''; }

  $('#role').onclick = function () { openSet('akun'); };
  $('#gear').onclick = function () { openSet(''); };
  $('#lgBatal').onclick = tutupLogin;

  $('#lgF').onsubmit = function (ev) {
    ev.preventDefault();
    if (!auth) return;
    var btn = $('#lgBtn'), er = $('#lgErr');
    er.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Memproses…';

    auth.signInWithEmailAndPassword($('#lgE').value.trim(), $('#lgS').value)
      .then(tutupLogin)
      .catch(function (x) {
        er.textContent =
          x.code === 'auth/network-request-failed' ? 'Tidak ada koneksi internet.' :
          x.code === 'auth/too-many-requests' ? 'Terlalu banyak percobaan. Coba lagi nanti.' :
          'Email atau kata sandi salah.';
      })
      .then(function () { btn.disabled = false; btn.textContent = 'Masuk'; });
  };

  $('#lgDaftar').onclick = function () {
    var er = $('#lgErr'), email = $('#lgE').value.trim(), pw = $('#lgS').value;
    if (!auth) return;
    if (!email || pw.length < 6) { er.textContent = 'Isi email dan kata sandi (minimal 6 karakter), lalu ketuk Daftar.'; return; }
    er.textContent = 'Mendaftar…';
    auth.createUserWithEmailAndPassword(email, pw).then(tutupLogin).catch(function (x) {
      er.textContent =
        x.code === 'auth/email-already-in-use' ? 'Email itu sudah terdaftar. Ketuk Masuk.' :
        x.code === 'auth/weak-password' ? 'Kata sandi terlalu lemah (minimal 6 karakter).' :
        x.code === 'auth/invalid-email' ? 'Format email salah.' :
        x.code === 'auth/network-request-failed' ? 'Tidak ada koneksi internet.' : 'Gagal mendaftar.';
    });
  };

  $('#lgLupa').onclick = function () {
    var email = $('#lgE').value.trim(), er = $('#lgErr');
    if (!auth) return;
    if (!email) { er.textContent = 'Isi email dulu, lalu ketuk Lupa kata sandi.'; return; }
    auth.sendPasswordResetEmail(email)
      .then(function () { er.textContent = 'Jika email terdaftar, tautan reset sudah dikirim.'; })
      .catch(function () { er.textContent = 'Gagal mengirim. Cek email dan koneksi.'; });
  };

  /* =========================================================
   * Mulai
   * ========================================================= */
  function tandaiMuat() {
    if (++loaded === TOTAL_SUMBER) {
      clearTimeout(loadTimer);
      note('');
      show();
    }
  }

  /** Tampilkan peringatan bila data yang terlihat masih dari simpanan HP dan server belum terjangkau. */
  function cekStale() {
    var dariHP = Object.keys(dariCache).some(function (k) { return dariCache[k]; });
    if (!dariHP) { clearTimeout(staleTimer); staleTimer = null; $('#stale').hidden = true; return; }
    if ($('#stale').hidden && !staleTimer) staleTimer = setTimeout(function () { staleTimer = null; $('#stale').hidden = false; }, 4000);
  }

  /** Langganan realtime satu koleksi. */
  function langganan(koleksi, simpanData, query) {
    var pertama = true;
    (query || db.collection(koleksi)).onSnapshot({ includeMetadataChanges: true }, function (s) {
      dariCache[koleksi] = !!s.metadata.fromCache;
      cekStale();
      var ambil = function () { simpanData(s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })); };
      if (pertama) { pertama = false; ambil(); tandaiMuat(); return; }
      if (!s.docChanges().length) return;   // hanya status sinkron yang berubah
      ambil();
      fill();
    }, function () {
      note('Data belum bisa dimuat.', 'red');
    });
  }

  function init() {
    applyTema();
    applyUkuran();
    renderNav();
    $('#view').innerHTML = '<p class="sm">Memuat…</p>';

    var dariUrl = '';
    try { dariUrl = normKode(new URLSearchParams(location.search).get('r')); } catch (e) {}
    KODE = kodeSah(dariUrl) ? dariUrl : normKode(lsGet('kk-room-aktif'));
    if (!kodeSah(KODE)) KODE = '';
    if (KODE && dariUrl === KODE) lsSet('kk-room-aktif', KODE);

    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      fdb = firebase.firestore();
      auth = firebase.auth();
      fdb.enablePersistence({ synchronizeTabs: true }).catch(function () {});   // data tetap terbaca saat sinyal buruk
    } catch (e) {
      fdb = null;
    }

    if (!fdb) {
      $('#role').textContent = 'Hanya lihat';
      $('#view').innerHTML = '<div class="alert red">Koneksi ke server gagal. Cek internet lalu muat ulang.</div>';
      return;
    }

    db = KODE ? ruang(KODE) : null;
    var rn = daftarRoom().filter(function (r) { return r.kode === KODE; })[0];
    if (rn) { RNAMA = rn.nama; $('#ttl').textContent = RNAMA; }

    auth.onAuthStateChanged(function (u) {
      if (unsubRoles) { unsubRoles(); unsubRoles = null; }
      ROLES = {};
      if (u && db) {
        unsubRoles = db.doc('akses/roles').onSnapshot(function (s) {
          ROLES = s.exists ? s.data() : {};
          terapkanPeran();
        }, function () { ROLES = {}; terapkanPeran(); });
      }
      terapkanPeran();
    });

    if (!KODE) { tab = 'set'; sub = 'room'; show(); return; }

    fdb.collection('groups').doc(KODE).onSnapshot(function (s) {
      if (s.exists) {
        RNAMA = s.data().nama || KODE;
        $('#ttl').textContent = RNAMA;
        simpanRoom(KODE, RNAMA);
      } else if (!s.metadata.fromCache) {
        pesanRoom = 'Room ' + KODE + ' tidak ditemukan. Periksa kodenya.';
        lupakanRoom(KODE); lsSet('kk-room-aktif', '');
        KODE = ''; db = null; RNAMA = ''; $('#ttl').textContent = 'Kaskita';
        openSet('room');
      }
    }, function () {});

    loadTimer = setTimeout(function () {
      note('Data belum terjangkau, mungkin belum yang terbaru.');
    }, 10000);

    langganan('members', function (a) { M = a; });
    langganan('pay', function (a) { P = a; });
    langganan('exp', function (a) { X = a; });
    langganan('log', function (a) { LOG = a; }, db.collection('log').orderBy('ts', 'desc').limit(100));

    var cfgPertama = true;
    db.doc('cfg/main').onSnapshot(function (s) {
      if (s.exists) CFG = s.data();
      if (cfgPertama) { cfgPertama = false; tandaiMuat(); } else { fill(); }
    }, function () {
      if (cfgPertama) { cfgPertama = false; tandaiMuat(); }
    });
  }

  init();

  /* Service worker (agar bisa dipasang sebagai PWA/APK) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
